<style>
:root{--bg:#f5efe3;--card:#fffdf8;--ink:#3a2d20;--mut:#a08a70;--tea:#8a5a2e;--tea-dark:#5c3a1c;--gold:#c2a26b;--bd:#e6d9c2;--soft:#f0e7d6}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}

header .sub{margin-top:10px;font-size:13px;color:#dbc7a4;letter-spacing:2px}

.search input{width:100%;padding:13px 20px 13px 46px;font-size:15px;border:none;border-radius:26px;outline:none;background:rgba(255,255,255,.96);box-shadow:0 6px 20px rgba(0,0,0,.25);transition:.2s;color:var(--ink)}

.search::before{content:"";position:absolute;left:17px;top:50%;width:14px;height:14px;margin-top:-9px;border:2px solid var(--mut);border-radius:50%}
.search::after{content:"";position:absolute;left:29px;top:50%;width:7px;height:2px;margin-top:5px;background:var(--mut);transform:rotate(45deg)}
.wrap{max-width:1060px;margin:0 auto;padding:22px 16px 60px}
.groups{display:flex;flex-direction:column;gap:12px}
.group{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(90,60,25,.05)}
.group summary{cursor:pointer;padding:14px 20px;font-size:15px;font-weight:600;color:var(--tea-dark);list-style:none;display:flex;align-items:center;gap:10px;user-select:none;transition:background .15s}
.group summary:hover{background:var(--soft)}
.group summary::before{content:"❖";font-size:13px;color:var(--gold);transition:transform .25s}
.group[open] summary::before{transform:rotate(90deg)}
.group summary .cnt{margin-left:auto;font-weight:400;color:var(--mut);font-size:12px;background:var(--soft);padding:2px 10px;border-radius:10px}
.tags{display:flex;flex-wrap:wrap;gap:8px;padding:4px 20px 18px}
.tag{padding:6px 15px;font-size:13.5px;border:1px solid var(--bd);border-radius:18px;background:#fff;color:#6b563c;cursor:pointer;transition:all .18s;user-select:none}
.tag:hover{border-color:var(--gold);color:var(--tea);transform:translateY(-1px);box-shadow:0 2px 8px rgba(194,162,107,.25)}
.tag.on{background:linear-gradient(135deg,var(--tea),var(--tea-dark));color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(138,90,46,.35)}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin:20px 4px 12px;padding:0 6px}

.list{display:flex;flex-direction:column;gap:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px 22px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gold);opacity:0;transition:opacity .2s}
.card:hover{box-shadow:0 8px 24px rgba(90,60,25,.12);border-color:#d5c2a0;transform:translateY(-2px)}
.card:hover::before,.card.open::before{opacity:1}
.card .title{font-family:"Kaiti SC","STKaiti","KaiTi","楷体","Songti SC",serif;font-size:18px;font-weight:700;color:var(--tea-dark)}
.card .meta{font-size:12px;color:var(--mut);margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card .meta .tg{background:var(--soft);color:var(--tea);padding:2px 9px;border-radius:10px;font-size:11.5px}
.card .meta .author{color:#6b563c;font-weight:500}
.card .preview{font-family:"Songti SC","SimSun","宋体",serif;font-size:14px;color:#7a6750;margin-top:10px;line-height:1.8}
.card .full{display:none;margin-top:12px;padding-top:14px;border-top:1px dashed var(--bd);font-size:14.5px;line-height:2;font-family:"Songti SC","SimSun","宋体",serif;color:#4a3a2a}
.card.open .full{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.card .full .note{color:var(--tea);margin-top:10px;font-size:13.5px}
.card .full .kuan{color:var(--mut);font-size:12.5px;margin-top:10px;text-align:right}
.empty{text-align:center;color:var(--mut);padding:70px 0;font-size:15px}
.empty::before{content:"🍃";display:block;font-size:40px;margin-bottom:14px}
@media(max-width:600px){header h1{font-size:25px;letter-spacing:4px}.card .title{font-size:16.5px}}
</style>

const POEMS = [{"t": "正山堂赋", "a": "呼延华", "d": "当代", "v": "赋·古风", "b": "正山堂诗词", "w": ["武夷山，林抱峰涌，绿掩水澜。集岱宗太华之崇，雾锁峰腰；聚终南", "太行之美，翠入云天。桐木关，坐拥空濛灵氛，云蒸霞蔚；演绎宽和人伦，", "灿若文锦。正山堂，界九曲溪流，退谷营居；挂百川飞瀑，悬壶作舍。", "夫物之感人者，在天莫如月，在乐莫如琴，在饮莫如茶。", "茶之正者正山堂，执禅茶一味，旨趣缈远；沐茶圣遗风，情致幽婉。", "茶之臻品者金骏眉，或开汤橙黄，鲜活甘爽；或匀齐显毫，抱朴守一。茶", "之逸品者正山小种，或色泽乌润，喉韵绵长；或盏底留香，意韵丰赡。正", "山堂茶，悠悠乎，如白云之霏霖；汤汤乎，如松涛之滢滢。", "茶之大者正山堂，太华夜碧，承朝露集以菁华；人闻清钟，伴日月聚", "以光辉。正山堂主，江氏一脉，情交天下茗客，义结四海高风。探茶之趣", "味本源，叶间通造化；释茶之圆融自在，意表出云霞。虽一隅之执著，然", "百代之长歌；虽一己之绵薄，然万众之高焯。恰如清人之谓：烹调味尽东", "南美，最是工夫茶与汤。", "茶香袅绕，沁仙风道骨；茶水润心，悟妙理玄机。", "黄杨摇曳，观红茶真妙；体素储洁，咏人生年华。", "一片青山入座，一潭山泉煮茶。夫正山堂者，秉承丰壤之泽，冲而弥", "柔；蕴取甘霖之降，洁而弥甘。润德精进，清涧引茶人驻足；鉴秘参详，", "林前使陆羽留踪。"], "n": [], "k": "丙申(2016 年)晚春 抒于北京朗朗书房", "g": "赋", "cp": ["金骏眉", "正山小种"], "rg": ["骏眉红·武夷山"], "tp": "咏茶", "season": ["春"], "jq": [], "cpai": "", "st": "赋"}, {"t": "金骏眉赋", "a": "陆永建", "d": "当代", "v": "赋·古风", "b": "正山堂诗词", "w": ["金骏眉者，武夷奇茗。纳天地之精，汲日月之灵。元勋高士，积雪囊", "黄。千揉岩骨，百焙兰馨。金汤亮黄，味計无竟。一啜一品，把盏邀月，", "闲庭养性;一酬一和，举杯迎风，甘露怡情。面无晦浊之态，心无鄙俗之兴。", "至静至雅，消块垒以物外;亦茶亦禅，浮太和而身轻。名传神州之八遐，道", "播华夏之泉井。", "偈云:吃茶去!"], "n": [], "k": "", "g": "赋", "cp": ["金骏眉"], "rg": ["骏眉红·武夷山"], "tp": "咏茶", "season": ["夏"], "jq": [], "cpai": "", "st": "赋"}, {"t": "金骏眉赋", "a": "林光纪", "d": "当代", "v": "赋·古风", "b": "正山堂诗词", "w": ["嘉叶兹降兮武夷，皇天既孕兮尤矣。眉眇眇兮俊突，金灼灼兮辉熠，", "峻岭采野兮奔砥。受命不凡兮玉蕊香凝，厚地复萌兮甘霖广朝，聚山川今", "灵气，吸日月兮精谛;盛世出兮茶魂道诣。", "一芽透双遗，吮汉唐之雨露，汲宋明之虹霓。朱子棹九曲，水矶注集。", "苏轼假慢亭，吟空对弈。聆玉女私语，借大王风起。春接雾霭兮研容幽芳，", "夏戏清流兮悦淑比翼，秋拾翠羽兮云端翔弋，冬纵雪盖兮明珠披衣。一脉", "一络皆春秋，崇安故邑。", "和为魂，把盏八艺;诚为体，奉茗五礼。三冲九泡兮腾烟波逶迤，一瓯", "数叶兮知万物天地。", "外赏五形:迫察嫩意，鲜若处子新溶，被金间玄黄，皓质兮玉顾。望观", "条索，少线隽茂，重实成一，襛纤兮得衷，紧细兮素己。近视色泽，瑰姿", "艳倚，柔润兮静秀，芳泽兮无疑。凝聚匀整，修短合宜，丘岭兮叠叠，方", "竹兮离离。辨析净度，非碎兮元匝，梗无其理，瑜纯兮屏翳，挺好兮明丽。", "内鉴四理:汤色金黄，玛瑙浓郁，披金圈兮璀旎，烟瑶碧兮华仪;香气可人，", "百果蕴袭，含高山兮韵律，吐婀娜兮飘逸;滋味醇厚，爽滑甘贻，云蒸兮霞", "蔚，香馥兮蒸奇;叶底舒展，金针比翼，色古铜兮芽活，秀静波兮神怡。", "横空出新品，红茶一奇迹。诞生桐木关，生态佳境双遗，世界红茶发", "祥地，四百年正山小种兮风靡。竹林小憩，故枝新芽，素手捻刈，古法承", "技。玉指日采二千芽，纤纤五万练斤茶。名贵久心仪，一饮长相忆。", "一壶乾坤大，尘凡相别楫，夕天流霞，晨池涟漪。携佳茗入梦，醉西", "子依依。品至尊兮金骏眉，吟《茶经》今风雅习，此赋并记。"], "n": [], "k": "辛卯（2011 年）仲夏", "g": "赋", "cp": ["金骏眉", "正山小种"], "rg": ["骏眉红·武夷山"], "tp": "咏茶", "season": ["春", "夏", "秋", "冬"], "jq": [], "cpai": "", "st": "赋"}, {"t": "正山堂茶君子赋", "a": "侯书栋", "d": "当代", "v": "赋·古风", "b": "正山堂诗词", "w": ["白云在天，掩映大王之崔巍；绿波盈浦，鉴览九曲之清芬。吟耆卿之", "风月兮，感幽怀而孤往；思晦庵之理欲兮，独旷世以伦群。夫造化蕴藉，", "人文润泽，必出奇珍。", "正山堂主，天降大任。续百年之茶脉兮，浚源于桐木关；振宇内之红", "风兮，建勋以金骏眉。", "正山堂号，名实互印。正者，养浩然气；山者，载坤厚德；堂者，显", "光明相。表小种之宗系，记贵人之机缘，铭茶心之本贞。", "正山堂茶，茶中君子。沐风饮露，参天地之化育；匠作繁制，粹万芽", "之精髓。其色澄亮兮如金珀，其香通透兮冲百会，其味甘朴兮涤脏腑。", "尔乃茶力不增不减，茶意不偏不倚，茶道不生不灭。以至深契中庸，", "暗合庄老，直指人心。", "诗载道，茶亦载道。而三教会通者，惟茶而已矣！或和光同尘，入柴", "米油盐行列；或雅人深致，与诗酒书画并举；或禅茶一味，得慈悲喜舍大", "觉。君子茶，茶君子，是人是茶，亦人亦茶，人茶不二，各得其所哉。"], "n": [], "k": "戊戌（2018 年）初夏作于桐木关", "g": "赋", "cp": ["金骏眉"], "rg": ["骏眉红·武夷山"], "tp": "咏茶", "season": ["夏"], "jq": [], "cpai": "", "st": "赋"}, {"t": "到正山堂", "a": "华干林", "d": "当代", "v": "赋·古风", "b": "正山堂诗词", "w": ["红稀香少季，万里下崇安。", "清溪九曲水，高峻武夷山。", "闽赣一千里，最美桐木关。", "茶园万顷绿，小种出正山。", "神品金骏眉，一饮即入禅。", "雅主留人住，客心不思还。"], "n": ["戊戌夏日，游武夷山，客桐木关“正山堂”。此处乃知名红茶“正山小种”发源地。“正山", "堂”主江元勋，为极品红茶“金骏眉”创始人。"], "k": "2018 年6 月13 日清晨鸟鸣之时", "g": "赋", "cp": ["金骏眉", "正山小种"], "rg": ["骏眉红·武夷山"], "tp": "纪游访茶", "season": ["夏"], "jq": [], "cpai": "", "st": "赋"}, {"t": "金骏眉", "a": "孟庆千", "d": "当代", "v": "赋·古风", "b": "正山堂诗词", "w": ["武夷东南秀，佳茗瑞草奇。桐关云雾绕，九曲迤逦随。", "枝嫩黄金蕊，芽香峭壁危。纤指摘晴翠，骏逸似扬眉。", "萎凋叶转绿，摇青看季期。小炉焙新火，罗扇动风吹。", "煮泉轻泛碧，芳馨透玉卮。含英入唇齿，清芬沁身姿。", "举杯烟袅袅，凝眸意痴痴。世间称绝品，谁个不萦思。"], "n": [], "k": "2016 年6 月于山东曲阜", "g": "赋", "cp": ["金骏眉"], "rg": ["骏眉红·武夷山"], "tp": "咏茶", "season": [], "jq": [], "cpai": "", "st": "赋"}, {"t": "茶乡桐木", "a": "卜宪民", "d": "当代", "v": "绝句", "b": "正山堂诗词", "w": ["九曲溪头谷岭间，朝阳初映半边山。", "回眸远望春风里，家住茶山几道弯。"], "n": [], "k": "2020 年7 月于江苏徐州", "g": "诗", "cp": [], "rg": ["骏眉红·武夷山"], "tp": "咏茶", "season": ["春"], "jq": [], "cpai": "", "st": "七绝"}, {"t": "题画《松荫茶话》", "a": "卜宪民", "d": "当代", "v": "绝句", "b": "正山堂诗词", "w": ["松荫茶话临溪涧，多少韶华忆旧年。", "常恋此间风物好，青山一派映孤烟。"], "n": [], "k": "2020 年7 月于江苏徐州", "g": "诗", "cp": [], "rg": [], "tp": "咏茶", "season": [], "jq": [], "cpai": "", "st": "七绝"}, {"t": "题金骏眉", "a": "万丽丽", "d": "当代", "v": "绝句", "b": "正山堂诗词", "w": [" [], "jq": [], "cpai": "阮郎归", "st": "词"}, {"t": "青玉案·品金骏眉", "a": "张凯军", "d": "当代", "v": "词", "b": "正山堂诗词", "w": ["青山滴翠云无语。似梦幻、飞思绪。一脉茶源春几度。霜花落雪，武夷", "烟雨。唯有君知处。", "饱尝孤寂茶情注。金骏飘香客垂慕。愿品仙芽和月煮。沉浮雅志，津生", "妙趣。擎盏眉飞舞。"], "n": ["君，指正山小种红茶第二十四代传承人江元勋先生。"], "k": "2020 年7 月于吉林通榆", "g": "词", "cp": ["金骏眉", "正山小种"], "rg": ["骏眉红·武夷山"], "tp": "品茶", "season": ["春"], "jq": [], "cpai": "青玉案", "st": "词"}, {"t": "洞仙歌·咏金骏眉", "a": "陈菁楠", "d": "当代", "v": "词", "b": "正山堂诗词", "w": ["武夷深秀，说仙人曾住。岁岁云芽沁甘露。摘春丛、占得眉绿山横，", "浓欲染，又引流霞几处。", "色匀盛玉碗，琥珀光盈，可醒诗脾写千赋。更坐看浮沉、世事无涯，香", "不散、凝烟收雨。待余味翛然起清风，是吹远埃尘，一番神悟。"], "n": [], "k": "2020 年7 月于上海", "g": "词", "cp": ["金骏眉"], "rg": ["骏眉红·武夷山"], "tp": "咏茶", "season": ["春"], "jq": [], "cpai": "洞仙歌", "st": "词"}, {"t": "摊破南乡子·为呼延兄辟正山茶事新境贺", "a": "陈斌", "d": "当代", "v": "词", "b": "正山堂诗词", "w": ["日月哺山川。真滋味，草木亲传。正山一品三千念：太初不二，功成九", "转，返本归元。", "桐木好修仙。无再觅，紫府云天。可堪回首归墟日：流光霎那，诗交莫", "逆，道问呼延。"], "n": ["1.呼延.莫逆，指呼延华.莫逆两位才华横溢.以茶入道的人民大学大学同学。2.桐木指武夷", "山桐木关，系呼延正山茶新事发端所在，亦是正山小种发源地，金骏眉创始之地。3.正山字面之", "意为“正宗茶山”，此处是指呼延与正山堂少主江志东先生开启的正山茶新事。4.太初.不二.功", "成九转.返本归元.紫府.归墟.霎那，皆系道门用语。"], "k": "2020 年1 月", "g": "词", "cp": ["金骏眉", "正山小种"], "rg": ["骏眉红·武夷山"], "tp": "贺庆纪念", "season": [], "jq": [], "cpai": "摊破南乡子", "st": "词"}, {"t": "浣溪沙·品金骏眉", "a": "陈瑞林", "d": "当代", "v": "词", "b": "正山堂诗词", "w": ["风蕴清香雨蕴根，林泉深处有遗痕。骏眉小种武夷魂。", "百味人生如梦幻，三杯香茗绝浮尘。如潮诗思合氤氲。"], "n": [], "k": "2020 年7 月于天津河东", "g": "词", "cp": ["金骏眉"], "rg": ["骏眉红·武夷山"], "tp": "品茶", "season": [], "jq": [], "cpai": "浣溪沙", "st": "词"}, {"t": "浣溪沙·饮茶", "a": "罗富贵", "d": "当代", "v": "词", "b": "正山堂诗词", "w": ["拂去微尘镜有光，晨天净洗慕春阳，闲庭茗坐独思量。", "颜色几输杨柳嫩，情怀不辨海棠香，岂如莺燕过匆忙。"], "n": [], "k": "2020 年7 月6 日于四川成都", "g": "词", "cp": [], "rg": [], "tp": "品茶", "season": ["春"], "jq": [], "cpai": "浣溪沙", "st": "词"}, {"t": "南乡子·茶", "a": "周淑华", "d": "当代", "v": "词", "b": "正山堂诗词", "w": ["细雨润农庄，朝雾氤氲绿色妆。筐篓采茶乡妹靓，匆忙，穿越田间小路旁。", "高雅入书房，细品乌龙淡淡香。舞墨赋诗常作伴，斜阳，日暮红霞醉四方。"], "n": [], "k": "2020 年7 月4 日于天津南开", "g": "词", "cp": [], "rg": [], "tp": "采茶制茶", "season": [], "jq": [], "cpai": "南乡子", "st": "词"}, {"t": "谢池春慢·金骏红茶", "a": "宗银贵", "d": "当代", "v": "词", "b": "正山堂诗词", "w": ["海榴红遍，闻莺啭、风光灿。初叶似碧云，万朵争妍隽。净艳盈盈趣，", "客鬓花身伴。共松杉、多艳潋。花深姿态，丛绿琼妆璨。", "青裙玉面，骚客醉、游仙苑。施得春雷动，风裁茶红染。高雅纯真秀，", "丽质天生婉。北人痴、南国念。红茶相对，说与君听见。"], "n": [], "k": "2020 年7 月1 日于河南濮阳", "g": "词", "cp": [], "rg": [], "tp": "赠答酬和", "season": ["春"], "jq": [], "cpai": "谢池春慢", "st": "词"}, {"t": "满庭芳·桐木村品金骏眉红茶", "a": "承洁", "d": "当代", "v": "词", "b": "正山堂诗词", "w": ["九曲飞波，武夷叠翠，古茶云外苍茫。雾岚飘渺，新叶渐舒张。素手灵", "芽摘取，漫焙得、眉黛初妆。凝眸处，幽幽清气，梦里总牵肠。", "飞觞，宾客约，青泉煮茗，红玉分香。撷盈盏芳华，吟入诗行。浑觉春", "风吹拂，襟怀敞、神采飞扬。云天里，烟笼翠盖，一任醉仙乡。"], "n": ["依钦谱。"], "k": "2020 年7 月于江苏江阴", "g": "词", "cp": ["金骏眉"], "rg": ["骏眉红·武夷山"], "tp": "品茶", "season": ["春"], "jq": [], "cpai": "满庭芳", "st": "词"}, {"t": "鹧鸪天·品正山堂金骏眉茶感怀", "a": "赵文华", "d": "当代", "v": "词", "b": "正山堂诗词", "w": ["一品嘉声笃信诚，一堂好梦透清明。一春绿向心头漾，一抹红从眼底横。", "金之贵，骏之灵，眉间袅袅正山情。经年但得三杯饮，甘苦人生当自平。"], "n": [], "k": "2016 年6 月于辽宁建平", "g": "词", "cp": ["金骏眉"], "rg": [], "tp": "抒怀感怀", "season": ["春"], "jq": ["清明"], "cpai": "鹧鸪天", "st": "词"}, {"t": "一七令·茶", "a": "赵春荣", "d": "当代", "v": "词", "b": "正山堂诗词", "w": ["茶。清雅，无华。山间树，雾中花。文人诵美，百姓称佳。一杯馨画室，", "三盏醉农家。约友诵诗和曲，邀师赋曲描霞。品尽奇思连妙想，笑谈美月", "与奇葩。"], "n": [], "k": "2020 年7 月4 日于内蒙古通辽", "g": "词", "cp": [], "rg": [], "tp": "咏茶", "season": [], "jq": [], "cpai": "一七令", "st": "词"}, {"t": "鹧鸪天·试饮金骏眉茶", "a": "赵美新", "d": "当代", "v": "词", "b": "正山堂诗词", "w": ["味正香浓金骏眉，汤红芽嫩甚为奇。武夷甘露多滋润，桐木祥云更护持。", "倾半盏，喜尝之，沁人肺腑惹心痴。聊将小罐私藏起，留待明儿会友时。"], "n": ["依词林正韵，钦谱，例晏几道“彩袖殷勤”。"], "k": "2020 年7 月于安徽固镇", "g": "词", "cp": ["金骏眉"], "rg": ["骏眉红·武夷山"], "tp": "品茶", "season": [], "jq": [], "cpai": "鹧鸪天", "st": "词"}, {"t": "小重山·咏金骏眉茶", "a": "秦雪梅", "d": "当代", "v": "词", "b": "正山堂诗词", "w": ["自古仙山称武夷。云深开画境，暖烟迷。小芽缱绻破春枝。灵又巧，点", "点翠涟漪。", "采得美人眉。制成茶以后，色儿奇。金汤潋滟异香随。三两盏，妙趣待", "君题。"], "n": [], "k": "2020 年7 月于四川达州", "g": "词", "cp": ["金骏眉"], "rg": ["骏眉红·武夷山"], "tp": "咏茶", "season": ["春"], "jq": [], "cpai": "小重山", "st": "词"}, {"t": "沁园春·金骏眉", "a": "黄玉春", "d": "当代", "v": "词", "b": "正山堂诗词", "w": ["桐木山村，江氏元勋，廿四传人。正钻研珍品，攻坚革故；追求美味，", "除弊推新。嫩树丹山，鲜芽小种，带露清泠不染尘。精心选.只大师剖制，", "技艺超群。", "名茶如此传神，得真境真情演至纯。恰萎凋发酵，摇青捻整；阴干烘炒，", "点火调匀。周密流程，精良工艺，细小金黄色泽亲。高擎盏.数香飘四季，", "九域回春。"], "n": [], "k": "2020 年7 月5 日于黑龙江依兰", "g": "词", "cp": ["金骏眉"], "rg": ["骏眉红·武夷山"], "tp": "咏茶", "season": ["春"], "jq": [], "cpai": "沁园春", "st": "词"}, {"t": "行香子·感怀", "a": "崔希亮", "d": "当代", "v": "词", "b": "正山堂诗词", "w": ["又到新秋。独怕登楼。茶未冷、何事淹留。正山小种，润我心头。赏花", "中趣，水中月，雨中愁。", "隐逸林泉，不羡王侯。学陶翁、诗酒风流。南山放马，坦腹闲游。伴一", "壶酒，一天霞，一叶舟。"], "n": [], "k": "2018 年秋于京华", "g": "词", "cp": ["正山小种"], "rg": [], "tp": "抒怀感怀", "season": ["秋"], "jq": [], "cpai": "行香子", "st": "词"}, {"t": "南鄉子·清秋", "a": "崔希亮", "d": "当代", "v": "词", "b": "正山堂诗词", "w": ["雨过锦云长，北国清秋草野黄。一盏红茶妃子笑，微茫，满口甘醇乐未央。", "何处梦黄粱？槐树青青醉一觞。今夜泛舟湖海去，徜徉，万里家山热衷肠。"], "n": [], "k": "2019 年秋于京华", "g": "词", "cp": [], "rg": [], "tp": "其他", "season": ["秋"], "jq": [], "cpai": "南鄉子", "st": "词"}, {"t": "风入松·雪日品鋻妃子笑", "a": "崔希亮", "d": "当代", "v": "词", "b": "正山堂诗词", "w": ["乱花落尽意难平，霜雪满全京。高楼天上寒窗里，品香茗，默念金经。", "万树净消颜色，千金难换卿卿。", "暖冬曾遇百日晴，难得有诗情。今朝风起胡旋舞，更携来，一片荒清。", "且看冰晶化去，可期春雨飘零！"], "n": [], "k": "2019 年初冬于京华", "g": "词", "cp": [], "rg": [], "tp": "品茶", "season": ["春", "冬"], "jq": [], "cpai": "风入松", "st": "词"}, {"t": "行香子·金骏眉", "a": "葛永红", "d": "当代", "v": "词", "b": "正山堂诗词", "w": ["螺盏飘红，掬雪烹春。正山堂、不愧元勋。玉芽一叶，至味三分。得金", "之质，眉之相，骏之身。", "杯浮月色，敲诗赋韵。饮丹霞、香遏天云。神凝水魄，秀毓山魂。合禅", "之悟，僧之趣，道之真。"], "n": [], "k": "2016 年6 月于河南扶沟", "g": "词", "cp": ["金骏眉"], "rg": [], "tp": "咏茶", "season": ["春"], "jq": [], "cpai": "行香子", "st": "词"}, {"t": "摊破浣溪沙·品金骏眉，茶自武夷山", "a": "蒋娓", "d": "当代", "v": "词", "b": "正山堂诗词", "w": ["蟹眼初开淡淡烟，纤姿漫舞好生怜。不是等闲慕诗客，是茶仙。", "试倩寒灯同把盏，相将素月共忘言。一缕馨香牵梦远，武夷山。"], "n": ["蟹眼：比喻水初沸时泛起的小气泡。慕诗客：出自元稹《一七令·茶》，后被用作茶的代称。"], "k": "2020 年7 月1 日于四川达州", "g": "词", "cp": ["金骏眉"], "rg": ["骏眉红·武夷山"], "tp": "品茶", "season": [], "jq": [], "cpai": "摊破浣溪沙", "st": "词"}, {"t": "鹧鸪天·谢三波君邀品金骏眉", "a": "蒋娓", "d": "当代", "v": "词", "b": "正山堂诗词", "w": ["十载麒麟未见真，席间相识问前因。玉壶口诵卢仝赋，金骏眉吟陆羽文。", "星欲坠，月微醺。街灯恋恋别离身。何当一醉賨人谷，梦向武夷茶树春。"], "n": ["賨人谷：三波君家乡。武夷茶树：指三波君斥巨资在武夷山购得一茶树。"], "k": "2020 年7 月1 日于四川达州", "g": "词", "cp": ["金骏眉"], "rg": ["骏眉红·武夷山"], "tp": "赠答酬和", "season": ["春"], "jq": [], "cpai": "鹧鸪天", "st": "词"}, {"t": "唐多令·品茶", "a": "蒋娓", "d": "当代", "v": "词", "b": "正山堂诗词", "w": ["焉待玉颜黄，灵心巧扮忙。吸精华，尽日随阳。待得妆成还看取，羞百", "草，傲群芳。", "三五聚云窗，铁壶置炭旁。正清谈，慢品新汤。尝遍红茶浑不似，恁般", "味，恁般香。"], "n": [], "k": "2020 年7 月1 日于四川达州", "g": "词", "cp": [], "rg": [], "tp": "品茶", "season": [], "jq": [], "cpai": "唐多令", "st": "词"}, {"t": "鹧鸪天·耽醉金骏眉", "a": "程良宝", "d": "当代", "v": "词", "b": "正山堂诗词", "w": ["应信沉浮是地天，正山金俊诱人前。问禅但得禅心净，品味犹求味道全。", "三勺叶，半瓢泉，清香拉近四方贤。胸怀沐浴如明镜，烘炒揉搓尝到鲜。", "2020 年7 月于陕西", "卷五古人茶诗词集粹（15 首）"], "n": [], "k": "", "g": "词", "cp": ["金骏眉"], "rg": [], "tp": "咏茶", "season": [], "jq": [], "cpai": "鹧鸪天", "st": "词"}, {"t": "饮茶歌诮崔石使君", "a": "皎然", "d": "唐", "v": "古人诗词集萃", "b": "正山堂诗词", "w": ["越人遗我剡溪茗，采得金牙爨金鼎。", "素瓷雪色缥沫香，何似诸仙琼蕊浆。", "一饮涤昏寐，情来朗爽满天地。", "再饮清我神，忽如飞雨洒轻尘。", "三饮便得道，何须苦心破烦恼。", "此物清高世莫知，世人饮酒多自欺。", "愁看毕卓瓮间夜，笑向陶潜篱下时。", "崔侯啜之意不已，狂歌一曲惊人耳。", "孰知茶道全尔真，唯有丹丘得如此。"], "n": [], "k": "", "g": "诗", "cp": [], "rg": [], "tp": "品茶", "season": [], "jq": [], "cpai": "", "st": "七古"}, {"t": "与赵莒茶宴", "a": "钱起", "d": "唐", "v": "古人诗词集萃", "b": "正山堂诗词", "w": ["竹下忘言对紫茶，全胜羽客醉流霞。", "尘心洗尽兴难尽，一树蝉声片影斜。"], "n": [], "k": "", "g": "诗", "cp": [], "rg": [], "tp": "咏茶", "season": [], "jq": [], "cpai": "", "st": "七绝"}, {"t": "山泉煎茶有怀", "a": "白居易", "d": "唐", "v": "古人诗词集萃", "b": "正山堂诗词", "w": ["坐酌泠泠水，看煎瑟瑟尘。", "无由持一碗，寄与爱茶人。"], "n": [], "k": "", "g": "诗", "cp": [], "rg": [], "tp": "咏茶", "season": [], "jq": [], "cpai": "", "st": "五绝"}, {"t": "一字至七字诗·茶", "a": "元稹", "d": "唐", "v": "古人诗词集萃", "b": "正山堂诗词", "w": ["茶，香叶，嫩芽。慕诗客，爱僧家。碾雕白玉，罗织红纱。铫煎黄蕊色，", "碗转曲尘花。夜后邀陪明月，晨前独对朝霞。洗尽古今人不倦，将知醉后", "岂堪夸。"], "n": [], "k": "", "g": "诗", "cp": [], "rg": [], "tp": "咏茶", "season": [], "jq": [], "cpai": "", "st": "五古"}, {"t": "走笔谢孟谏议寄新茶", "a": "卢仝", "d": "唐", "v": "古人诗词集萃", "b": "正山堂诗词", "w": ["日高丈五睡正浓，军将打门惊周公。口云谏议送书信，", "白绢斜封三道印。开缄宛见谏议面，手阅月团三百片。", "闻道新年入山里，蛰虫惊动春风起。天子须尝阳羡茶，", "百草不敢先开花。仁风暗结珠琲瓃，先春抽出黄金芽。", "摘鲜焙芳旋封裹，至精至好且不奢。至尊之馀合王公，", "何事便到山人家。柴门反关无俗客，纱帽笼头自煎吃。", "碧云引风吹不断，白花浮光凝碗面。一碗喉吻润，", "两碗破孤闷。三碗搜枯肠，唯有文字五千卷。四碗发轻汗，", "平生不平事，尽向毛孔散。五碗肌骨清，六碗通仙灵。", "七碗吃不得也，唯觉两腋习习清风生。蓬莱山，在何处。", "玉川子，乘此清风欲归去。山上群仙司下土，", "地位清高隔风雨。安得知百万亿苍生命，", "堕在巅崖受辛苦。便为谏议问苍生，到头还得苏息否。"], "n": [], "k": "", "g": "诗", "cp": [], "rg": [], "tp": "赠答酬和", "season": ["春"], "jq": [], "cpai": "", "st": "七古"}, {"t": "奉和袭美茶具十咏·茶人", "a": "陆龟蒙", "d": "唐", "v": "古人诗词集萃", "b": "正山堂诗词", "w": ["天赋识灵草，自然钟野姿。", "闲来北山下，似与东风期。", "雨后探芳去，云间幽路危。", "唯应报春鸟，得共斯人知。"], "n": [], "k": "", "g": "诗", "cp": [], "rg": [], "tp": "赠答酬和", "season": ["春"], "jq": [], "cpai": "", "st": "五律"}, {"t": "望江南·超然台作", "a": "苏轼", "d": "宋", "v": "古人诗词集萃", "b": "正山堂诗词", "w": ["春未老，风细柳斜斜。试上超然台上看，半壕春水一城花。烟雨暗千家。", "寒食后，酒醒却咨嗟。休对故人思故国，且将新火试新茶。诗酒趁年华。"], "n": [], "k": "", "g": "词", "cp": [], "rg": ["超然红"], "tp": "其他", "season": ["春"], "jq": [], "cpai": "望江南", "st": "词"}, {"t": "满庭芳·茶", "a": "黄庭坚", "d": "宋", "v": "古人诗词集萃", "b": "正山堂诗词", "w": ["北苑春风，方圭圆璧，万里名动京关。碎身粉骨，功合上凌烟。尊俎风", "流战胜，降春睡、开拓愁边。纤纤捧，研膏浅乳，金缕鹧鸪斑。", "相如，虽病渴，一觞一咏，宾有群贤。为扶起灯前，醉玉颓山。搜搅胸", "中万卷，还倾动、三峡词源。归来晚，文君未寐，相对小窗前。"], "n": [], "k": "", "g": "词", "cp": [], "rg": [], "tp": "咏茶", "season": ["春"], "jq": [], "cpai": "满庭芳", "st": "词"}, {"t": "喜得建茶", "a": "陆游", "d": "宋", "v": "古人诗词集萃", "b": "正山堂诗词", "w": ["玉食何由到草莱，重奁初喜坼封开。", "雪霏庾岭红丝磑，乳泛闽溪绿地材。", "舌本常留甘尽日，鼻端无复鼾如雷。", "故应不负朋游意，手挈风炉竹下来。"], "n": [], "k": "", "g": "诗", "cp": [], "rg": [], "tp": "咏茶", "season": [], "jq": [], "cpai": "", "st": "七律"}, {"t": "咏茶", "a": "朱熹", "d": "宋", "v": "古人诗词集萃", "b": "正山堂诗词", "w": ["武夷高处是蓬莱，采得灵根手自栽。", "地僻芳菲镇长在，谷寒蜂蝶未全来。", "红裳似欲留人醉，锦障何妨为客开。", "饮罢醒心何处所，远山重叠翠成堆。"], "n": [], "k": "", "g": "诗", "cp": [], "rg": ["骏眉红·武夷山"], "tp": "咏茶", "season": [], "jq": [], "cpai": "", "st": "七律"}, {"t": "水调歌头·咏茶", "a": "白玉蟾", "d": "宋", "v": "古人诗词集萃", "b": "正山堂诗词", "w": ["二月一番雨，昨夜一声雷。枪旗争展，建溪春色占先魁。采取枝头雀舌，", "带露和烟捣碎，炼作紫金堆。碾破香无限，飞起绿尘埃。", "汲新泉，烹活火，试将来。放下兔毫瓯子，滋味舌头回。唤醒青州从事，", "战退睡魔百万，梦不到阳台。两腋清风起，我欲上蓬莱。"], "n": [], "k": "", "g": "词", "cp": [], "rg": [], "tp": "咏茶", "season": ["春"], "jq": [], "cpai": "水调歌头", "st": "词"}, {"t": "临江仙·试茶", "a": "辛弃疾", "d": "宋", "v": "古人诗词集萃", "b": "正山堂诗词", "w": ["红袖扶来聊促膝，龙团共破春温。高标终是绝尘氛，西厢留竹影，一水", "试啼痕。", "饮罢清风生两腋，余香齿颊犹存。离情凄咽更休论，银鞍和月载，金碾", "为谁分。"], "n": [], "k": "", "g": "词", "cp": [], "rg": [], "tp": "品茶", "season": ["春"], "jq": [], "cpai": "临江仙", "st": "词"}, {"t": "诉衷情·闲中一盏建溪茶", "a": "张抡", "d": "宋", "v": "古人诗词集萃", "b": "正山堂诗词", "w": ["闲中一盏建溪茶。香嫩雨前芽。砖炉最宜石铫，装点野人家。", "三昧手，不须夸。满瓯花。睡魔何处，两腋清风，兴满烟霞。"], "n": [], "k": "", "g": "诗", "cp": [], "rg": [], "tp": "咏茶", "season": [], "jq": [], "cpai": "", "st": "五古"}, {"t": "谒金门·和韵赋茶", "a": "吴潜", "d": "宋", "v": "古人诗词集萃", "b": "正山堂诗词", "w": ["汤怕老，缓煮龙芽凤草。七碗徐徐撑腹了。卢家诗兴渺。", "君岂荆溪路杳，我已泾川梦绕。酒兴茶酣人语悄。莫教鸡聒晓。"], "n": [], "k": "", "g": "诗", "cp": [], "rg": [], "tp": "赠答酬和", "season": [], "jq": [], "cpai": "", "st": "五律"}, {"t": "浣溪沙·试茶", "a": "洪希文", "d": "元", "v": "古人诗词集萃", "b": "正山堂诗词", "w": ["独坐书斋日正中。平生三昧试茶功。起看水火自争雄。势挟怒涛翻急雪，", "韵胜甘露透香风。晚凉月色照孤松。", "附录（2 则）"], "n": [], "k": "", "g": "词", "cp": [], "rg": [], "tp": "品茶", "season": [], "jq": [], "cpai": "浣溪沙", "st": "词"}, {"t": "茶道五说", "a": "为[正山堂·正山茶]而作", "d": "当代", "v": "附录", "b": "正山堂诗词", "w": ["正山茶设计师", "莫逆文", "正山堂少主江志东先生，携吾同窗呼延华君，制正山五茶，正念心诚，", "茶道盈怀。余受命设计，感念在兹，是为之记。天地毓灵秀，阴阳授华滋。", "道源相承，依类兴盛。采碧玉丹霞漫啜，循幽境以澹虑；持墨盏雪瓷闲品，", "兴逸趣而舒怀。湛然于肺腑，畅然于表里。生津祛燥，消积御疾。此养生", "者，茶道一说也。", "事百姓者不惑，立千秋者不媚，行万里者不系。叶卷叶舒，渐离痴而去", "妄；味深味浅，终返璞而归真。苍崖云邈，出神入化；清潭镜澈，观实凌", "虚。体通六识，心至无极。此出离者，茶道二说也。", "擅制器者水火自洽，惟精惟一，妙至毫巅；知饮茶者物我往还，无滞无", "碍，层出不穷。以无华之华，施不意之意。以无用之用，行不为之为。器", "不器之器，知不知之知。此相合者，茶道三说也。", "水分二气，茶生五行。四时三界，万殊一本。顺流而下，不卑其弱；和", "光而上，不恃其强。显隐不夺其魄，浮沉不失其所。越体用直抵形质，通", "礼义不掩性情。此至理者，茶道四说也。", "物莫格之以贵贱，人莫缚之以悲喜，事莫欺之以方圆。天地之正，不僵", "不悖；人心之正，不伤不伪。清静无须问道，澄明不必称禅。味止有余韵，", "苦化有回甘。此达观者，茶道五说也。", "正山堂正山茶，端在其正。茶之正，在天地人同和，在色香味同清，在", "器名时同敬，在身心性同寂，在情趣意同真。怡情悦性，静神养生，出离", "而相合，至理而达观，是为茶之正道。"], "n": [], "k": "庚子（2020 年）孟春识于北京", "g": "文", "cp": [], "rg": [], "tp": "咏茶", "season": ["春", "秋"], "jq": [], "cpai": "", "st": "文"}, {"t": "金骏眉记", "a": "江泓", "d": "当代", "v": "附录", "b": "正山堂诗词", "w": ["华东第一峰，名黄岗山；山之阳有一脉，地有双泉，遂建寺宇以护之，", "故名双泉寺，以佑一方。双泉之水，恒满清澈，光洁若银，如龙脉之眼。", "山脉蜿蜒，亦犹如龙翼盘踞，其腹地则为由国家定为武夷山国家级重点自", "然保护区。其内有桐木古茶山，海拔600~1600 米，枕黄岗望武夷，株株老", "枞生烂石；浸砾壤，依山泉，伴野花，交古树；云雾、阳光、细雨、微风", "交互关美照，片片茶叶饱含龙脉自然之灵气，造化而成有机高贵之品质。", "桐木村江氏家族，宋代由河南入闽，敬持茶事，已传至二十四代。明", "末清初，疲军席茶而息，数日之后，不意茶已发酵，江祖遂以火焙之，全", "然发酵，因缘而得红茶。出而售之，爱者众，因有名气冠，得名“武夷正", "山小种”。至17 世纪，远销欧洲，风靡王室，饮红茶成为时尚。后立顿先", "生传习江氏正山红茶之工艺，制立顿红茶，泛销世界，西方由此形成了红", "茶文化。", "金骏眉之创始，实为本世纪初茶界头等幸事。由现代“茶圣”吴觉农", "致江元勋父亲书信之启示，受于江父故交茶界泰斗张天福“发展精制茶”", "之观念之启发，及北京茶友张孟江.孙连泉等倡导做好茶.购好茶.喝好茶之", "需求。江元勋先生得机率梁骏德.温永胜、江骏发、陈贵宝、江骏生、胡吉", "兴等员工，在老枞中采紫笋新芽，兼持精行俭德之精神，自2003 年仿龙井", "之基础，经几年不断探索，研发出第一款金骏眉。从红茶诞生至欧洲下午", "茶风尚，再至金骏眉问世，正山堂坚守传承红茶四百余载。", "金骏眉诞生，乃开启而今由其领军之全新红茶时代。此乃激发中国红", "茶走向复兴之时代，亦为带动红茶业界共同走向新兴繁荣之时代。", "正山堂江氏茶人于世界红茶之杰出贡献，皆令人深心怀感恩之情者，", "而世间茶人更为幸得正山堂之机缘而心怀感激喜悦。", "古语有云“试玉要烧七日满，辨才需待十年期”，桐木茶山独有之生", "态环境及正山堂古往今来之精湛工艺，赐予金骏眉之高贵品质、迷人风韵，", "十余年中皆得专家、茶人、消费者之共赏.好评。是啊，十个人在海拔1300", "米左右山头，选百年老枞采茶，才能得五万以上新芽而精制成一斤茶，其", "韵味天成，鲜爽纯正，汤色净明，如琥珀之光，这茶怎能不让人真爱于心", "呢。", "可以乃盼见，凝正山堂心血及地方各界热心之金骏眉，定将以世界第", "一红茶之美誉，光耀世界茶品之林，福惠天下。"], "n": [], "k": "回首，已饮金骏眉十年有余，有感于斯，以记之。 2016 年7 月", "g": "文", "cp": ["金骏眉", "正山小种", "正山红茶"], "rg": ["骏眉红·武夷山"], "tp": "采茶制茶", "season": [], "jq": [], "cpai": "", "st": "文"}, {"t": "山居饮茶感赋", "a": "李 芳", "d": "当代", "v": "古风", "b": "正山堂诗词·甲辰集", "w": ["眠云任自然，石鼎火生烟。窗映千峰翠，篱开曲径悬。", "步林逢老木，掇叶悦清泉。瓯浅茶香扑，山深树鸟潜。", "中怀浮世雪，二盏絶香笺。草木无穷意，烟霞未了禅。", "陶公疑访鹤，陆子欲邀鲜。同座春风里，冰心可问天。"], "n": [], "k": "二〇二三年九月于河北", "g": "诗", "cp": [], "rg": [], "tp": "品茶", "season": ["春"], "jq": [], "cpai": "", "st": "五古"}, {"t": "友人赠武夷山金骏眉茶", "a": "李海彪", "d": "当代", "v": "古风", "b": "正山堂诗词·甲辰集", "w": ["友人贻我茶，云是武夷玉。冰瓯试濡唇，一啜清耳目。", "再啜生春风，仿佛香满腹。坐听海潮来，忽变陵与谷。", "云峡决太古，上有阳春旭。桐木本雄关，悚壁攒剑镞。", "木茂漏余光，天低飞鸟局。昔人此拒敌，成败常反复。", "兴亡已几历，青青古嘉木。幸爲江公爱，尝之欣穆穆。", "培植出新品，得使时人服。侧身视流泉，浮磬当歌哭。", "嘉木古能新，我生老何促。况我远游子，飞霜欺独宿。", "武夷有嘉木，罗浮亦有属。尝此武夷玉，乡思愈生速。"], "n": [], "k": "二〇一七年十二月于广东", "g": "诗", "cp": ["金骏眉"], "rg": ["骏眉红·武夷山"], "tp": "赠答酬和", "season": ["春"], "jq": [], "cpai": "", "st": "五古"}, {"t": "正山堂雅聚分韵得屋字", "a": "韦树定", "d": "当代", "v": "古风", "b": "正山堂诗词·甲辰集", "w": ["避暑消夏客何去， 正山堂前待客速。", "幽宅古构得其势， 宛如亭盖覆堂屋。", "焚香啜茗宜乎时， 仿 嗟。安得常相访，还烹君子茶。"], "n": [], "k": "二〇二三年七月十五日于江苏高邮", "g": "诗", "cp": ["金骏眉", "正山小种"], "rg": ["骏眉红·武夷山"], "tp": "纪游访茶", "season": [], "jq": [], "cpai": "", "st": "五古"}, {"t": "茶经楼怀古", "a": "饶中学", "d": "当代", "v": "律诗", "b": "正山堂诗词·甲辰集", "w": ["天下茶经第一楼， 沧桑德泽意悠悠。", "檐飞紫气吞三楚， 额勒鸿名誉九州。", "槛外望穿风着雨， 杯中洗尽苦兼愁。", "竟陵多少兴衰事， 都付西江亘古流。"], "n": [], "k": "", "g": "诗", "cp": [], "rg": [], "tp": "怀古", "season": [], "jq": [], "cpai": "", "st": "七律"}, {"t": "暗香·泰山品茶", "a": "于艳萍", "d": "当代", "v": "词", "b": "正山堂诗词·甲辰集", "w": ["素妆一袭。对青花曼妙，娇憨无力。道骨仙风，一曲高山待君识。冲沸云翻雪浪，惊鸿舞、香尘盈溢。泠泠有、青凤余姿，耐得那清寂。", "安谧。又翕翕。任涧岚岱魂，染成春色。可曾记得。多少馨香女儿泽。心许青桐深处，看取她、浮沉如一。择一片、留月夜，与伊今夕。"], "n": [], "k": "", "g": "词", "cp": [], "rg": [], "tp": "品茶", "season": ["春"], "jq": [], "cpai": "暗香", "st": "词"}, {"t": "桂枝香·金骏眉", "a": "甘汶灵", "d": "当代", "v": "词", "b": "正山堂诗词·甲辰集", "w": ["晴川蘸翠。听九曲渔歌，欲生双翅。千尺苍屏瀑布，幻成云气。", "轻盈羽客追鸿影，问茶香，哪家如此？玉雕烟锁，桃源去处，武夷清丽。", "最难得、轩窗对水。笑痴蝶嗔蜂，争逐红紫。茶润诗行，唱遍鹤闲风懿。紫砂金骏红酥手，算逍遥、天地谁最？点犀香篆，青山与我，汝先憔悴！"], "n": [], "k": "二〇一七年十二月于四川", "g": "词", "cp": ["金骏眉"], "rg": ["骏眉红·武夷山"], "tp": "咏茶", "season": [], "jq": [], "cpai": "桂枝香", "st": "词"}, {"t": "水调歌头·咏正山小种", "a": "田丽静", "d": "当代", "v": "词", "b": "正山堂诗词·甲辰集", "w": ["采摘三千梦，煮沸一壶春。云烟生处，武夷山上露华新。漫把灵根濯洗，素手仙芽撷取，清气最怡人。炉火丹霞绮，未饮已先醺。", "烹瑞雪，凝月魄，聚精神。呷来小种，轻扣茶韵润吾唇。萦绕乡愁味道，慢品时光静好，此际远红尘。故事浮沉里，桐木藴清芬。"], "n": [], "k": "二〇二三年九月二十日于长春", "g": "词", "cp": ["正山小种"], "rg": ["骏眉红·武夷山"], "tp": "咏茶", "season": ["春"], "jq": [], "cpai": "水调歌头", "st": "词"}, {"t": "念奴娇·正山小种", "a": "伍思鹏", "d": "当代", "v": "词", "b": "正山堂诗词·甲辰集", "w": ["一春深日，渐空山凝緑，青霭茫茫。独立溟蒙天色下，柯叶初放幽香。梦雨江南，迷云瑶圃，何处认行藏。碧瓯流彩，恰能盈溢芬芳。", "来借新雪杯中，飘颻今古事，尽入柔肠。欲向洪炉参造化，物我如是相忘。大鹤归来，甘泉消渴，虚引晓风凉。淡烟将洗，素心明若朝阳。"], "n": [], "k": "二〇二三年七月五日于江西九江", "g": "词", "cp": ["正山小种"], "rg": [], "tp": "咏茶", "season": ["春"], "jq": [], "cpai": "念奴娇", "st": "词"}, {"t": "鹧鸪天·与友人饮金骏眉茶有记", "a": "李 静", "d": "当代", "v": "词", "b": "正山堂诗词·甲辰集", "w": ["桐木关前春正肥，囊中采得緑云归。烟沉满座匀分月，香袅重帘共举杯。", "倾肺腑，展襟期，人生甘苦个中知。他年相遇秋风里，应忆今宵金骏眉。"], "n": [], "k": "二〇一七年十二月于湖南", "g": "词", "cp": ["金骏眉"], "rg": ["骏眉红·武夷山"], "tp": "品茶", "season": ["春", "秋"], "jq": [], "cpai": "鹧鸪天", "st": "词"}, {"t": "念奴娇·武夷山桐木村访正山小种有感", "a": "李如意", "d": "当代", "v": "词", "b": "正山堂诗词·甲辰集", "w": ["风翻翠浪，过晴郊旷野，新芽争发。緑涨山肥牵远目，一缕嫩凉轻泄。燕剪初来，晚烟霞色，一派云天阔。思潮如马，几番春信难絶。", "遥想烹茗些些，苕溪旧事，今与何人说。昨夜扬帆丝路远，万里重洋徒涉。独占鳌头，福荫天下，一片黄金叶。千年犹把，五洲华夏连接。"], "n": [], "k": "二〇二三年八月于武夷山桐木关", "g": "词", "cp": ["正山小种"], "rg": ["骏眉红·武夷山"], "tp": "纪游访茶", "season": ["春", "夏"], "jq": [], "cpai": "念奴娇", "st": "词"}, {"t": "满庭芳·题金骏眉", "a": "肖广军", "d": "当代", "v": "词", "b": "正山堂诗词·甲辰集", "w": ["桐木关雄，武夷山秀，孕藏上饮灵根。餐霞啜露，浑个远嚣尘。", "采下嫩芽点点，巧焙就、最是弥珍。细看取，兼融三色，螺黛自含春。", "相求来远道，多爲知者，更有芳邻。始赢得、登临大雅称尊。", "尽可孤斟共品，不输与、玉酿精醇。怡情处，金汤消虑，兰味藴天真。"], "n": [], "k": "二〇二三年八月于内蒙古", "g": "词", "cp": ["金骏眉"], "rg": ["骏眉红·武夷山"], "tp": "咏茶", "season": ["春"], "jq": [], "cpai": "满庭芳", "st": "词"}, {"t": "沁园春·访正山小种发源地", "a": "肖检生", "d": "当代", "v": "词", "b": "正山堂诗词·甲辰集", "w": ["何处探寻，登武夷山，谒桐木关。看路循百转，杖趋幽境；溪萦九曲，琴弄清弦。云雾氤氲，峰峦缥缈，世外桃源别有天。尘嚣隔，许灵芽孕育，不计流年。", "红茶鼻祖超然，四百载传承誉宇寰。溯松枝烟焙，香含馥郁；桂圆汤酌，色藴澄鲜。汲以清泉，瀹之丹火，一盏怡神逸似仙。情相契，好结庐爲伴，悟道参禅。"], "n": [], "k": "二〇二三年九月二十日于福建", "g": "词", "cp": ["正山小种"], "rg": ["骏眉红·武夷山", "超然红"], "tp": "纪游访茶", "season": ["春"], "jq": [], "cpai": "沁园春", "st": "词"}, {"t": "采桑子·品金骏眉茶", "a": "冷子瑜", "d": "当代", "v": "词", "b": "正山堂诗词·甲辰集", "w": ["天然生就芳菲好，芽小毫微，黑发金眉。采下高山入客杯。", "灵泉沏出香何似？不是玫瑰，不是蔷薇，但觉春风满面吹。"], "n": [], "k": "二〇一八年七月十一日于北京", "g": "词", "cp": ["金骏眉"], "rg": [], "tp": "品茶", "season": ["春"], "jq": [], "cpai": "采桑子", "st": "词"}, {"t": "满江红·题雪域灵茶", "a": "沈双建", "d": "当代", "v": "词", "b": "正山堂诗词·甲辰集", "w": ["天碧云青，谁道是、我曾来过。有时节、忽然变化，雨掀风簸。", "雪域岂非闲世界，灵山信有新功课。是茗花、竞向冷寒开，争婀娜。", "凭照眼，繁星朵。尘与土，难沾涴。更翘英采采，有何不可。", "一叶一芽香几缕，如冰如雪知谁个。使浮生、百感到清幽，催新我。"], "n": [], "k": "二〇二三年七月十八日于江苏南通", "g": "词", "cp": [], "rg": [], "tp": "咏茶", "season": [], "jq": [], "cpai": "满江红", "st": "词"}, {"t": "临江仙·乘筏游九曲溪呈纪校长及诸师长", "a": "宋振锟", "d": "当代", "v": "词", "b": "正山堂诗词·甲辰集", "w": ["翠意盈盈藤老劲，颇藏无数禽声。溪青始见白鱼惊。九重朱子句，细看遁心生。", "烈水倏然斜竹座，人间几许平程。岩崖如海耸天争。大王峰仰止，古渡客情倾。"], "n": [], "k": "二〇一八年六月十二日于武夷山桐木关", "g": "词", "cp": [], "rg": [], "tp": "纪游访茶", "season": [], "jq": [], "cpai": "临江仙", "st": "词"}, {"t": "念奴娇·金骏眉", "a": "周其荣", "d": "当代", "v": "词", "b": "正山堂诗词·甲辰集", "w": ["古关幽远，忽遍山新茗，醒来桐木。霜色冰姿皆落尽，百里春风翻緑。谷雨溪云，玉纤衣袖，宛若千图轴。嘉时宾至，野亭同洗尘俗。", "列盏琥珀匀斟，披襟轻啜，入口回余馥。香气含温浮在眼，幻作駰骐腾足。梦里扶摇，情中天地，妙处闻鸾曲。苍生苏息，武夷花月相属。"], "n": [], "k": "二〇二三年小满于江苏滨海", "g": "词", "cp": ["金骏眉"], "rg": ["骏眉红·武夷山"], "tp": "咏茶", "season": ["春"], "jq": ["谷雨", "小满"], "cpai": "念奴娇", "st": "词"}, {"t": "水调歌头·咏金骏眉", "a": "宗寿华", "d": "当代", "v": "词", "b": "正山堂诗词·甲辰集", "w": ["武夷生碧玉，桐木起红霞。谁翻纤指，谷雨时节撷芳华？和得灵泉清露，架起泥炉文火，妙手煮生涯。且邀二三子，酽酽一壶茶。", "放幽怀，添雅趣，信无差。余香在齿，回味尤觉碧霞佳。养性修心合是，解渴安神最好，不负世人夸。独特尘凡少，只发正山芽。"], "n": [], "k": "二〇二三年八月于江苏", "g": "词", "cp": ["金骏眉"], "rg": ["骏眉红·武夷山"], "tp": "咏茶", "season": [], "jq": ["谷雨"], "cpai": "水调歌头", "st": "词"}, {"t": "水调歌头·春日与诗友赴超然台品超然红茶", "a": "屈怡君", "d": "当代", "v": "词", "b": "正山堂诗词·甲辰集", "w": ["春色涌齐鲁，胜景正堪怜。漫山嘉木流翠，烟雨润韶年。且约吟朋诗侣，小试新茶新火，有味是清欢。思接数千载，神逸白云边。", "润襟腑，开妙悟，绽清莲。芳馨不散，清气长绕小周天。若泛仙槎远渡，旋赴蓬壶沧海，去去不思还。倏忽心如水，万象渺如烟。"], "n": [], "k": "二〇二三年九月于江苏", "g": "词", "cp": ["超然红"], "rg": ["超然红"], "tp": "品茶", "season": ["春"], "jq": [], "cpai": "水调歌头", "st": "词"}, {"t": "浪淘沙·武夷山品正山小种", "a": "封 康", "d": "当代", "v": "词", "b": "正山堂诗词·甲辰集", "w": ["烟霭岭长留，纱帐迟收。茶姑玉指细肢柔。但愿化爲嘉木叶，独立枝头。", "入水色浓稠，馥郁难休。世人皆道此香优。斟一壶云华上下，我主沉浮。"], "n": [], "k": "二〇二三年三月二十日于武夷山", "g": "词", "cp": ["正山小种"], "rg": ["骏眉红·武夷山"], "tp": "品茶", "season": [], "jq": [], "cpai": "浪淘沙", "st": "词"}, {"t": "满庭芳·古丈红茶山感赋", "a": "胡春耕", "d": "当代", "v": "词", "b": "正山堂诗词·甲辰集", "w": ["饮露萦霞，晞阳绕水，柔荑翦翦争春。青浮梯垄，阡陌曲通村。佩篓湘娃采采，任舒卷、盈袖溪云。骏眉岭，岚光拂眼，掩映武陵津。", "尘烟揉捻尽，清风几度，搅动兰芬。听松声，西窗共话诗宾。玉盏锋苗浅泛，嘘乌润、点染丹唇。忘机处，冰泉慢滤，七碗欲销魂。"], "n": [], "k": "二〇二三年四月十日于湖南古丈", "g": "词", "cp": ["古丈红"], "rg": ["古丈红"], "tp": "咏茶", "season": ["春"], "jq": [], "cpai": "满庭芳", "st": "词"}, {"t": "渔歌子·家居小景", "a": "纪宝成", "d": "当代", "v": "词", "b": "正山堂诗词·甲辰集", "w": ["手有闲书气自华，暖心清肺一壶茶。篱院静，夕阳斜，阑珊意绪对窗纱。"], "n": [], "k": "二〇二〇年二月十五日傍晚于北京百旺家苑乐斋", "g": "词", "cp": [], "rg": [], "tp": "咏茶", "season": [], "jq": [], "cpai": "渔歌子", "st": "词"}, {"t": "水龙吟·游黄岗山", "a": "纪宝成", "d": "当代", "v": "词", "b": "正山堂诗词·甲辰集", "w": ["四边满目烟云，东南絶顶天穹远。层峦叠翠，断崖悬秘，雄峰劲健。緑满人间，苍茫奔涌，无分深浅。欲随风万里，海疆到处，一千遍、安澜愿。", "仔细登攀峰顶， 步沉坚、苍顔欢面。近观遥指， 群山踊跃，接天无倦。威武松杉，茂丰草甸，温柔苔藓。正销魂又是，军营故垒，似声声唤。"], "n": [], "k": "二〇二二年八月二十三日深夜于武夷桐木村正山堂", "g": "词", "cp": [], "rg": [], "tp": "纪游访茶", "season": [], "jq": [], "cpai": "水龙吟", "st": "词"}, {"t": "八声甘州·十月六日雅集朗朗书房", "a": "纪宝成", "d": "当代", "v": "词", "b": "正山堂诗词·甲辰集", "w": ["喜书房朗朗，又和风雅意满心头。聚新知老友，谈今兴奋，感旧温柔。笔走龙飞凤舞，情满便无休。澡雪精神焕，酣坐悠悠。", "虽未登山观海，却文情诗韵，夫复何求！有书中真味，华发最堪留。寸心安、一壶茶共，品几杯、清意共清秋。神思远，五湖烟雨，天际归舟。"], "n": ["苏轼《哨遍》句：“琴书中有真味。”"], "k": "二〇二二年十月十日夜于京城乐斋", "g": "词", "cp": [], "rg": [], "tp": "雅集茶会", "season": ["秋"], "jq": [], "cpai": "八声甘州", "st": "词"}, {"t": "玉漏迟·深秋探访植物园", "a": "纪宝成", "d": "当代", "v": "词", "b": "正山堂诗词·甲辰集", "w": ["十月二十六日，在校友陈世军陪同下游北京植物园，访园中北京曹雪芹学会，感赋此调。菊花多絶色，盆栽类聚，迷人图案。曲径蜿蜒，远近层林如染。五彩斑斓盈目，提步去、身心齐焕。弯路转，静湖碧水，黄芦争粲。", "此处文苑多情，更远去尘嚣，一窗明艳。漫品老茶，清议曹公无倦。流韵遗风何在？杯共举、一壶情感。归路叹，秋色透通肝胆。"], "n": [], "k": "二〇二二年十月二十七日上午于京城乐斋", "g": "词", "cp": [], "rg": [], "tp": "纪游访茶", "season": ["秋"], "jq": [], "cpai": "玉漏迟", "st": "词"}, {"t": "画堂春·自贺乐斋词学随笔完稿", "a": "纪宝成", "d": "当代", "v": "词", "b": "正山堂诗词·甲辰集", "w": ["怡然自得幕屏前，清茶几口香甜。行行悦目字珠圆，页页光鲜。"], "n": [], "k": "窗映满头白发，清欢满室当年。杖朝岁月又新篇，笑向云天。 二〇二四年二月十五日清晨于京城乐斋", "g": "词", "cp": [], "rg": [], "tp": "贺庆纪念", "season": ["春"], "jq": [], "cpai": "画堂春", "st": "词"}, {"t": "浣溪沙·采茶", "a": "秦 凤", "d": "当代", "v": "词", "b": "正山堂诗词·甲辰集", "w": ["翠岭生香云不遮，翻飞巧手采新芽。山乡明媚簇红纱。", "春意浓时斜燕子，緑烟堆处绽桐花。一蓬笑语一兜茶。"], "n": [], "k": "", "g": "词", "cp": [], "rg": [], "tp": "采茶制茶", "season": ["春"], "jq": [], "cpai": "浣溪沙", "st": "词"}, {"t": "沁园春·雪域灵茶", "a": "马建勛", "d": "当代", "v": "词", "b": "正山堂诗词·甲辰集", "w": ["西藏林芝， 雪域灵茶， 馥郁正山。看根生净土，纤尘不染，叶凝仙露，秾翠犹鲜。内敛精华，中和灵秀，独有柔香绕梦间。", "蒙天厚，有云笼茗圃，水润冰川。浅斟色韵如丹，方入口、心融四月天。忆莺飞草长，江南已掬，骏眉蜜味，婉约仍缠。月落杯中，樱红眼里，不尽韶华不尽怜。君知否，此一番品味，九转流连。"], "n": [], "k": "二〇二三年六月二十八日于苏州", "g": "词", "cp": [], "rg": [], "tp": "咏茶", "season": ["春"], "jq": [], "cpai": "沁园春", "st": "词"}, {"t": "浣溪沙", "a": "华干林", "d": "当代", "v": "词", "b": "正山堂诗词·甲辰集", "w": ["一曲新词茶一杯，朝来犹忆武夷陲。风流际会令人迷。", "无翼能飞桐木去，有心可托白云归。且将诗句寄金龟。"], "n": ["与正山堂江志东先生隔空对茶得句，并再贺《正山堂诗词·壬寅集》隆重发行！金龟，武夷山“水金龟”的传说。"], "k": "二〇二二年八月二十一日于扬州", "g": "词", "cp": [], "rg": ["骏眉红·武夷山"], "tp": "其他", "season": [], "jq": [], "cpai": "", "st": "词"}, {"t": "鹧鸪天·书斋品茶", "a": "徐中秋", "d": "当代", "v": "词", "b": "正山堂诗词·甲辰集", "w": ["香茗自烹还自斟，壶中嫩叶任浮沉。此身已许尘嚣外，不管窗前晴与阴。", "翻典籍，抚瑶琴，书斋容我自由心。正山茶味醇如酒，偶制新诗信口吟。"], "n": [], "k": "二〇二三年九月于浙江", "g": "词", "cp": [], "rg": [], "tp": "品茶", "season": [], "jq": [], "cpai": "鹧鸪天", "st": "词"}, {"t": "行香子·正山堂超然红", "a": "徐艺宁", "d": "当代", "v": "词", "b": "正山堂诗词·甲辰集", "w": ["世外悠闲，月下氤氲。得超然方得灵根。千山叠翠，不染纤尘。采一钱风，三钱露，五钱云。", "可餐秀色，能医虚身。啜茶汤、舌底生津。杯中尤物，谁与相亲。有刘公书，苏公画，窦公文。"], "n": ["刘公、窦公分别指刘墉、窦光鼐，皆爲诸城人。苏公指苏轼，在知密州时修建超然台。"], "k": "二〇二一年十二月于山东", "g": "词", "cp": ["超然红"], "rg": ["超然红"], "tp": "风景山水", "season": [], "jq": [], "cpai": "行香子", "st": "词"}, {"t": "鹧鸪天·咏武夷山正山小种", "a": "孙洪伟", "d": "当代", "v": "词", "b": "正山堂诗词·甲辰集", "w": ["养在云乡月作邻，仙霞玉露濯灵根。去寻天上无双种，来煮人间第一春。", "桐木梦，武夷魂，正山堂下藴精神。试将清气萦怀抱，从此生涯远俗尘。"], "n": [], "k": "二〇二三年九月三十日于辽宁", "g": "词", "cp": ["正山小种"], "rg": ["骏眉红·武夷山"], "tp": "咏茶", "season": ["春"], "jq": [], "cpai": "鹧鸪天", "st": "词"}, {"t": "念奴娇·收到武夷山金骏眉茶", "a": "孙运才", "d": "当代", "v": "词", "b": "正山堂诗词·甲辰集", "w": ["远来千里，是江南春色，带露犹清。碧水丹山皆可寄，况乎吾友深情。慰我愁肠，滋人肺腑，倏忽觉身轻。三杯添爽，飕飕两腋风生。", "全抛俗虑尘心，悠观世事，奕奕眼眸明。有好风光茶占尽，天地灵气相仍。桐木香熏，武夷温润，骏彩自天成。酽汤私煮，一壶闲倚云扃。"], "n": [], "k": "二〇二三年九月二十八日于南京", "g": "词", "cp": ["金骏眉"], "rg": ["骏眉红·武夷山"], "tp": "咏茶", "season": ["春"], "jq": [], "cpai": "念奴娇", "st": "词"}, {"t": "浣溪沙·武夷客中品金骏眉", "a": "曹继梅", "d": "当代", "v": "词", "b": "正山堂诗词·甲辰集", "w": ["疏雨微风山外山，万般俗事总无关。一瓯泉水煮明前。", "香气沉浮汤有色，骏眉舒展自含烟。人间妙味是清欢。"], "n": [], "k": "二〇二二年九月十五日于福建南平", "g": "词", "cp": ["金骏眉"], "rg": ["骏眉红·武夷山"], "tp": "品茶", "season": [], "jq": [], "cpai": "浣溪沙", "st": "词"}, {"t": "鹧鸪天·金骏眉", "a": "许少昂", "d": "当代", "v": "词", "b": "正山堂诗词·甲辰集", "w": ["名种奇馨与世殊，武夷茶誉满江湖。春芽挺处烟云绕，甘露倾时玉体舒。", "香漫溢，梦沾濡，是非宠辱总归无。展眉不记闲滋味，做伴天涯是此壶。"], "n": [], "k": "二〇一七年十二月于广东", "g": "词", "cp": ["金骏眉"], "rg": ["骏眉红·武夷山"], "tp": "咏茶", "season": ["春"], "jq": [], "cpai": "鹧鸪天", "st": "词"}, {"t": "临江仙·超然红", "a": "张崇正", "d": "当代", "v": "词", "b": "正山堂诗词·甲辰集", "w": ["南揽重洋紫气，上依千古彤阳。超然浓酽问华章。正山抛马辔，浮沫饮全唐。", "地秀桃源引凤，神扶芝岭栖凰。玉瓯琼液浸芽香。浓浓茶一盏，十里尽芬芳。"], "n": [], "k": "二〇二一年十二月于山东", "g": "词", "cp": ["超然红"], "rg": ["超然红"], "tp": "其他", "season": [], "jq": [], "cpai": "临江仙", "st": "词"}, {"t": "水调歌头·游武夷山做客茶园饮金骏眉兴作", "a": "张瑞文", "d": "当代", "v": "词", "b": "正山堂诗词·甲辰集", "w": ["溪岸柳烟静，峻岭举初阳。漫坡空翠宁寂，随处散清香。应是天公妙手，汲取仙山灵气，成就好茶乡。千载碧霞魄，赢取正山堂。", "游胜境，消块垒，话安康。泥炉活水，无尽春色紫砂藏。莫道年华诗酒，且看烹云煮月，漫饮好时光。今做武夷客，从此不相忘。"], "n": [], "k": "二〇二三年十月于黑龙江", "g": "词", "cp": ["金骏眉"], "rg": ["骏眉红·武夷山"], "tp": "纪游访茶", "season": ["春"], "jq": [], "cpai": "水调歌头", "st": "词"}, {"t": "满庭芳·武夷山红茶", "a": "闵凡军", "d": "当代", "v": "词", "b": "正山堂诗词·甲辰集", "w": ["九曲流香，丹霞幻彩，武夷天育仙芽。东君驾到，緑海荡灵槎。空谷青波叠翠，千层浪、岚雾笼纱。蓄佳气、正山小种，饮界一枝花。", "新丫凝碧露，素瓷琥珀，瑶草琪葩。涤尘烦、壶中日月心遐。金叶馋涎陆羽，茶产业、富了农家。斜阳里，紫砂品梦，听十里鸣蛙。"], "n": [], "k": "二〇二三年七月于黑龙江", "g": "词", "cp": ["正山小种"], "rg": ["骏眉红·武夷山"], "tp": "风景山水", "season": [], "jq": [], "cpai": "满庭芳", "st": "词"}, {"t": "浣溪沙·乐品金骏眉", "a": "邹继惠", "d": "当代", "v": "词", "b": "正山堂诗词·甲辰集", "w": ["拾趣人间好主张，茶中翘楚乐珍藏。闲来惬意煮金汤。", "金骏眉鲜尤耐品，尘心易醉几壶香。浮生况味解炎凉。"], "n": [], "k": "二〇二三年七月于江苏", "g": "词", "cp": ["金骏眉"], "rg": [], "tp": "品茶", "season": [], "jq": [], "cpai": "浣溪沙", "st": "词"}, {"t": "柳梢青·乡野人家", "a": "温小燕", "d": "当代", "v": "词", "b": "正山堂诗词·甲辰集", "w": ["雀闹枝桠，鸡鸣篱落，又见烟斜。鱼戏波心，莺藏叶底，共浴柔霞。", "闲来信步观花， 摘几朵， 吟诗煮茶。踏遍青山， 邀来明月，一起还家。"], "n": [], "k": "", "g": "词", "cp": [], "rg": [], "tp": "其他", "season": [], "jq": [], "cpai": "柳梢青", "st": "词"}, {"t": "鹧鸪天·古丈红茶春茶采得奉诸公", "a": "杨允平", "d": "当代", "v": "词", "b": "正山堂诗词·甲辰集", "w": ["春茶采得奉诸公，针尖立水一丛丛。烟霞色好新晴现，花果香浮古丈红。", "湘楚韵，土苗风，昔爲贡品赠唐宫。今将千载芬芳气，散向东西南北中。"], "n": [], "k": "二〇二三年九月于浙江", "g": "词", "cp": ["古丈红"], "rg": ["古丈红"], "tp": "咏茶", "season": ["春"], "jq": [], "cpai": "鹧鸪天", "st": "词"}, {"t": "醉花阴·戏侃茶友", "a": "杨玲玲", "d": "当代", "v": "词", "b": "正山堂诗词·甲辰集", "w": ["蛮友见茶施浩劫，自诩人中杰。一罐漏壶春，着意深藏，兼顾黄金叶。", "香氛漫向邻家觉，电话言辞切：请过俺家来，带点原型，附上煎烹诀。"], "n": [], "k": "二〇一八年于三峡大学", "g": "词", "cp": [], "rg": [], "tp": "咏茶", "season": ["春"], "jq": [], "cpai": "醉花阴", "st": "词"}, {"t": "沁园春·品正山堂正山小种感怀", "a": "杨晓航", "d": "当代", "v": "词", "b": "正山堂诗词·甲辰集", "w": ["石鼎烹花，铜炉煮梦，初认清芬。渐鱼珠破后，新悬软雾，松涛响处，暗扫娇尘。雪浪轻翻，甘泉缓注，起舞凌波水溅裙。幽岩韵，带武夷佳气，淡袅融春。", "可怜仙种灵根。苍崖上、悠然自有神。幻芳芽微吐，空山听雨，素襟半展，老树眠云。玉骨含香，冰肌浸月，梳掠烟鬟翠黛匀。诗境里，更风情千种，滋味销魂。"], "n": [], "k": "二〇二三年八月十五日于大理", "g": "词", "cp": ["正山小种"], "rg": ["骏眉红·武夷山"], "tp": "抒怀感怀", "season": ["春"], "jq": [], "cpai": "沁园春", "st": "词"}, {"t": "念奴娇·宿白沙黎族自治县生态茶园", "a": "赵秀敏", "d": "当代", "v": "词", "b": "正山堂诗词·甲辰集", "w": ["千山环碧，正星空来客，远避红尘。采撷归来香满篓，溪水流过黄昏。海岛烟霞，陨坑①风叶，竹杖踏星辰。红炉围坐，清谈古驿烟村。", "漫煮佳茗相邀，开怀忘物我，永驻芳春。一曲温柔歌未了，小径花落缤纷。皓月分辉，临流垂钓，四顾絶尘氛。茶乡吟啸，此生闲若浮云。"], "n": ["①星空来客、陨坑：白沙有“陨坑茶乡”的美称，白沙茶园分布在沙陨石坑及其周围。"], "k": "二〇二三年十月七日于深圳", "g": "词", "cp": [], "rg": ["白沙红"], "tp": "纪游访茶", "season": ["春"], "jq": [], "cpai": "念奴娇", "st": "词"}, {"t": "沁园春·正山堂“骏眉中国”颂", "a": "刘献琛", "d": "当代", "v": "词", "b": "正山堂诗词·甲辰集", "w": ["桐木关盘，巅接黄岗，峰叠翠微。映茂林修竹，山场栈道；小桥流水，蛱蝶芳菲。雾锁层峦，烟埋峡谷，鸣佩泉源九曲溪。穿闽赣，望巉岩缭绕，云路逶迤。", "虫蛇禽鸟幽栖，更嫩茗飘香醉武夷。有正山小种，红茶鼻祖；老枞灌木，緑干苔枝。叶底绒毛，芽头条索，果蜜芳馨金骏眉。昭华夏，共复兴伟业，再铸传奇。"], "n": [], "k": "二〇二三年三月二十日于山东", "g": "词", "cp": ["金骏眉", "正山小种", "骏眉中国"], "rg": ["骏眉红·武夷山"], "tp": "咏茶", "season": ["春", "夏"], "jq": [], "cpai": "沁园春", "st": "词"}, {"t": "踏莎行·茶马古道", "a": "潘闫苗", "d": "当代", "v": "词", "b": "正山堂诗词·甲辰集", "w": ["茗煮春秋，尘埋世故，悠悠古道凭回顾。似听风笛诉沧桑，声声挤满行人路。", "十里长街，千年老树，惯听马踏声如雨。飞骑影断月明中，还期古韵留些许。"], "n": [], "k": "", "g": "词", "cp": [], "rg": [], "tp": "咏茶", "season": ["春", "秋"], "jq": [], "cpai": "踏莎行", "st": "词"}, {"t": "一萼红·普安红", "a": "龙 健", "d": "当代", "v": "词", "b": "正山堂诗词·甲辰集", "w": ["普安林。有云头嘉树， 峰杳拂轻阴。着露香融， 凝烟瑞吐，千叠直挹春霖。摘星共、流风回雪，逼仙境、焉受俗尘侵。幽谷吹兰，清溪唤月，絶色重临。", "笑问采茶儿女，是清歌何起，逸趣谁寻。纤手摇青，朱唇衔碧，一盏几许情深。算极品、筵邀雅旧，细斟罢、醒目且舒心。待到来年回味，更胜如今。"], "n": [], "k": "二〇二三年八月二十日于贵州贵阳", "g": "词", "cp": ["普安红"], "rg": ["普安红"], "tp": "采茶制茶", "season": ["春"], "jq": [], "cpai": "一萼红", "st": "词"}, {"t": "临江仙·武夷金骏眉", "a": "魏国保", "d": "当代", "v": "词", "b": "正山堂诗词·甲辰集", "w": ["雾绕丹霞歌负氧，武夷茶女云端。指尖采采蝶翩翩。鸟鸣丫滴翠，百岭荡心弦。", "汤色金黄香有骨，松涛灵舌悠然。眉舒明月静参禅。沉浮多况味，一盏小江天。"], "n": [], "k": "二〇二三年五月二十日于湖南", "g": "词", "cp": ["金骏眉"], "rg": ["骏眉红·武夷山"], "tp": "咏茶", "season": [], "jq": [], "cpai": "临江仙", "st": "词"}, {"t": "江神子·雪裹大王峰", "a": "谢秀桐", "d": "当代", "v": "词", "b": "正山堂诗词·甲辰集", "w": ["倾天玉屑下青霄，任纷抛，势飘颻。緑树丹崖，处处是琼瑶。欲逼大王装老者，银鬓发，白眉毛。", "风呼雪卷竞嘶嚎，近虓虓，远叨叨。吹冻春顔，通体裹纱绡。谁认此翁真实相，无一语，说魔妖。"], "n": [], "k": "二〇二二年二月十九日于福州", "g": "词", "cp": [], "rg": [], "tp": "其他", "season": ["春"], "jq": [], "cpai": "江神子", "st": "词"}, {"t": "蓦山溪·桐木关写意", "a": "谢秀桐", "d": "当代", "v": "词", "b": "正山堂诗词·甲辰集", "w": ["危岩对瞩， 峰断连云矗。雾重乱云飞， 锁天堑、惊心骇目。一溪奔雪，豪雨水犹清，凝碧玉。悬皓瀑，夹岸山灵緑。", "横屏围嶂， 隐约仙凡谷。忆昔控关防， 造垣堞、残存构筑。道通茶马，煮茗看云升，观蛱蝶，亲麂鹿。险处藏清趣。"], "n": [], "k": "二〇二三年三月二十五日于武夷山", "g": "词", "cp": [], "rg": ["骏眉红·武夷山"], "tp": "其他", "season": [], "jq": ["雨水"], "cpai": "蓦山溪", "st": "词"}, {"t": "水调歌头·咏绍兴会稽红", "a": "苏 俊", "d": "当代", "v": "词", "b": "正山堂诗词·甲辰集", "w": ["山数会稽秀，茶爱会稽红。浙东千古佳处，约略武夷同。好趁清明谷雨，直上青岩紫府，纤手摘春风。归去汲丹井，恍与葛仙逢。①", "带云气，揉皎月，焙金茸。骏眉香发，堪誉神品出神工。② 欲召卢仝鸿渐，爲置冰瓯雪碗，吟啸豁心胸。细味无尘境，天地入包容。"], "n": ["①归去汲丹井，恍与葛仙逢：会稽山有葛洪炼丹井。②骏眉香发，堪誉神品出神工：绍兴会稽红茶爲骏眉红茶系列。"], "k": "二〇二三年七月于广东", "g": "词", "cp": [], "rg": ["骏眉红·武夷山", "会稽红"], "tp": "咏茶", "season": ["春"], "jq": ["清明", "谷雨"], "cpai": "水调歌头", "st": "词"}, {"t": "卜算子·咏金骏眉", "a": "严家国", "d": "当代", "v": "词", "b": "正山堂诗词·甲辰集", "w": ["浣作一玲珑，蕊细禅心悟。半盏空明半盏香，般若无穷处。", "不以换秋冬，不管风和雨。不论红尘喜与悲，淡淡杯中语。"], "n": [], "k": "二〇一七年十二月于安徽", "g": "词", "cp": ["金骏眉"], "rg": [], "tp": "咏茶", "season": ["秋", "冬"], "jq": [], "cpai": "卜算子", "st": "词"}, {"t": "水调歌头·咏正山堂红茶", "a": "罗金龙", "d": "当代", "v": "词", "b": "正山堂诗词·甲辰集", "w": ["骏影眉间展，小种正山红。白云依岭，十万嘉木郁葱葱。带武夷嫩叶，九曲桐溪活水，香国寄情衷。满撷烟霞气，烹入紫砂中。啜佳茗，赊月色，效坡公。煎春半勺，金汤潋滟韵无穷。岩壑清风旧约，杯底人生况味，心喜两相融。会得沉浮意，俯仰自从容。"], "n": [], "k": "二〇二三年七月于湖南", "g": "词", "cp": ["正山红茶"], "rg": ["骏眉红·武夷山"], "tp": "咏茶", "season": ["春"], "jq": [], "cpai": "水调歌头", "st": "词"}, {"t": "饮茶歌送郑容", "a": "皎 然", "d": "唐", "v": "古人诗词集萃", "b": "正山堂诗词·甲辰集", "w": ["丹丘羽人轻玉食， 采茶饮之生羽翼。", "名藏仙府世空知， 骨化云宫人不识。", "云山童子调金铛， 楚人茶经虚得名。", "霜天半夜芳草折， 烂漫缃花啜又生。", "赏君此茶祛我疾， 使人胸中荡忧栗。", "日上香炉情未毕， 醉踏虎溪云， 高歌送君出。"], "n": [], "k": "", "g": "诗", "cp": [], "rg": [], "tp": "品茶", "season": [], "jq": [], "cpai": "", "st": "七古"}, {"t": "咏茶十二韵", "a": "齐 己", "d": "唐", "v": "古人诗词集萃", "b": "正山堂诗词·甲辰集", "w": ["百草让爲灵，功先百草成。甘传天下口，贵占火前名。", "出处春无雁，收时谷有莺。封题从泽国，贡献入秦京。", "嗅觉精新极，尝知骨自轻。研通天柱响，摘绕蜀山明。", "赋客秋吟起，禅师昼卧惊。角开香满室，炉动緑凝铛。", "晚忆凉泉对，闲思异果平。松黄干旋泛，云母滑随倾。", "颇贵高人寄，尤宜别匮盛。曾寻修事法，妙尽陆先生。"], "n": [], "k": "", "g": "诗", "cp": [], "rg": [], "tp": "咏茶", "season": ["春", "秋"], "jq": [], "cpai": "", "st": "五古"}, {"t": "双井茶", "a": "欧阳脩", "d": "宋", "v": "古人诗词集萃", "b": "正山堂诗词·甲辰集", "w": ["西江水清江石老， 石上生茶如凤爪。", "穷腊不寒春气早， 双井芽生先百草。", "白毛囊以红碧纱， 十斤茶养一两芽。", "长安富贵五侯家， 一啜犹须三日夸。", "宝云日注非不精， 争新弃旧世人情。", "岂知君子有常德， 至宝不随时变易。", "君不见建溪龙凤团， 不改旧时香味色。"], "n": [], "k": "", "g": "诗", "cp": [], "rg": [], "tp": "咏茶", "season": ["春"], "jq": [], "cpai": "", "st": "七古"}, {"t": "试院煎茶", "a": "苏 轼", "d": "宋", "v": "古人诗词集萃", "b": "正山堂诗词·甲辰集", "w": ["蟹眼已过鱼眼生， 飕飕欲作松风鸣。", "蒙茸出磨细珠落， 眩转绕瓯飞雪轻。", "银瓶泻汤夸第二， 未识古人煎水意。", "君不见， 昔时李生好客手自煎，贵从活火发新泉。", "又不见， 今时潞公煎茶学西蜀，定州花瓷琢红玉。", "我今贫病常苦飢， 分无玉碗捧蛾眉。", "且学公家作茗饮， 砖炉石铫行相随。", "不用撑肠拄腹文字五千卷，但愿一瓯常及睡足日高时。"], "n": [], "k": "", "g": "诗", "cp": [], "rg": [], "tp": "咏茶", "season": [], "jq": [], "cpai": "", "st": "七古"}, {"t": "阮郎归·茶词", "a": "黄庭坚", "d": "宋", "v": "古人诗词集萃", "b": "正山堂诗词·甲辰集", "w": ["摘山初制小龙团。色和香味全。碾声初断夜将阑。烹时鹤避烟。", "消滞思，解尘烦。金瓯雪浪翻。只愁啜罢水流天。余清搅夜眠。"], "n": [], "k": "", "g": "词", "cp": [], "rg": [], "tp": "咏茶", "season": [], "jq": [], "cpai": "阮郎归", "st": "词"}, {"t": "满庭芳·茶词", "a": "秦 观", "d": "宋", "v": "古人诗词集萃", "b": "正山堂诗词·甲辰集", "w": ["雅燕飞觞，清谈挥麈，使君高会群贤。密云双凤，初破缕金团。", "窗外炉烟似动，开尊试、一品香泉。轻淘起，香生玉乳，雪溅紫瓯圆。", "娇鬟。宜美盼，双擎翠袖，稳步红莲。坐中客翻愁，酒醒歌阑。", "点上纱笼画烛，花骢弄、月影当轩。频相顾，余欢未尽，欲去且留连。"], "n": [], "k": "", "g": "词", "cp": [], "rg": [], "tp": "咏茶", "season": [], "jq": [], "cpai": "满庭芳", "st": "词"}, {"t": "兰亭道上四首·其三", "a": "陆 游", "d": "宋", "v": "古人诗词集萃", "b": "正山堂诗词·甲辰集", "w": ["陌上行歌日正长， 吴蚕捉绩麦登场。", "兰亭酒美逢人醉， 花坞茶新满市香。"], "n": [], "k": "", "g": "诗", "cp": [], "rg": [], "tp": "其他", "season": [], "jq": [], "cpai": "", "st": "七绝"}, {"t": "过扬子江二首·其一", "a": "杨万里", "d": "宋", "v": "古人诗词集萃", "b": "正山堂诗词·甲辰集", "w": ["只有清霜冻太空， 更无半点荻花风。", "天开云雾东南碧， 日射波涛上下红。", "千载英雄鸿去外， 六朝形胜雪晴中。", "携瓶自汲江心水， 要试煎茶第一功。"], "n": [], "k": "", "g": "诗", "cp": [], "rg": [], "tp": "纪游访茶", "season": [], "jq": [], "cpai": "", "st": "七律"}, {"t": "康王谷水帘", "a": "朱 熹", "d": "宋", "v": "古人诗词集萃", "b": "正山堂诗词·甲辰集", "w": ["循山西北骛，崎岖几经丘。前行荒蹊断，豁见清溪流。", "一涉台殿古，再涉川原幽。萦纡复屡渡，乃得寒岩陬。", "飞泉天上来，一落散不收。披崖日璀璨，喷壑风飕飗。"], "n": [], "k": "追薪爨絶品，瀹茗浇穷愁。敬酹古陆子，何年复来游。", "g": "诗", "cp": [], "rg": [], "tp": "其他", "season": [], "jq": [], "cpai": "", "st": "五古"}, {"t": "望江南·茶", "a": "吴文英", "d": "宋", "v": "古人诗词集萃", "b": "正山堂诗词·甲辰集", "w": ["松风远，莺燕静幽坊。妆褪宫梅人倦绣，梦回春草日初长。瓷碗试新汤。", "笙歌断，情与絮悠扬。石乳飞时离凤怨，玉纤分处露花香。人去月侵廊。"], "n": [], "k": "", "g": "词", "cp": [], "rg": [], "tp": "咏茶", "season": ["春"], "jq": [], "cpai": "望江南", "st": "词"}, {"t": "踏莎行·卢仝啜茶手卷", "a": "张 炎", "d": "宋", "v": "古人诗词集萃", "b": "正山堂诗词·甲辰集", "w": ["清气崖深，斜阳木末。松风泉水声相答。光浮碗面啜先春，何须美酒吴姬压。", "头上乌巾，鬓边白发。数间破屋从芜没。山中有此玉川人，相思一夜梅花发。"], "n": [], "k": "", "g": "词", "cp": [], "rg": [], "tp": "品茶", "season": ["春"], "jq": [], "cpai": "踏莎行", "st": "词"}, {"t": "煮土茶歌", "a": "洪希文", "d": "元", "v": "古人诗词集萃", "b": "正山堂诗词·甲辰集", "w": ["论茶自古称壑源， 品水无出中泉。", "莆中苦茶出土産， 乡味自汲井水煎。", "器新火活清味永， 且从平地休登仙。", "王侯第宅斗絶品， 揣分不到山翁前。", "临风一啜心自省， 此意莫与他人传。"], "n": [], "k": "", "g": "诗", "cp": [], "rg": [], "tp": "品茶", "season": [], "jq": [], "cpai": "", "st": "七古"}, {"t": "沁园春·送友入山采茶", "a": "陈维崧", "d": "清", "v": "古人诗词集萃", "b": "正山堂诗词·甲辰集", "w": ["十里溪山， 竹粉缨峦， 兰风藻川。有蒙茸萝葛， 蔽亏曦月，坦迤涧壑，向背林泉。夕渡遄归，晨渔缓出，谷唱潭吟韵邈绵。居此者，是秦时毛女，汉代琴仙。", "人家四月开园，送君去、刚逢谷雨天。恰晴村緑崦，数间僧竈，清江翠箬，一带商船。拍处盈盈，焙余冉冉，归卧回廊瘦石边。松涛沸，正龙团乍碾，蟹眼初煎。"], "n": [], "k": "", "g": "词", "cp": [], "rg": [], "tp": "采茶制茶", "season": ["春"], "jq": ["谷雨"], "cpai": "沁园春", "st": "词"}, {"t": "扫花游·试茶", "a": "朱彝尊", "d": "清", "v": "古人诗词集萃", "b": "正山堂诗词·甲辰集", "w": ["楝花放了，正谷雨初晴，逼篱云水。晓山十里。见春旗乍展，緑枪未试。立倦浓阴，听到吴歌遍起。焙香气。裊一缕午烟，人静门闭。", "清话能有几。任旧友相寻，素瓷频递。闷怀尽矣。况年来病酒，夜阑须记。活火新泉，梦绕松风曲几。暗灯里。隔窗纱、小童斜倚。"], "n": [], "k": "", "g": "词", "cp": [], "rg": [], "tp": "纪游访茶", "season": ["春"], "jq": ["谷雨"], "cpai": "扫花游", "st": "词"}, {"t": "正月二十日学海堂茶隐", "a": "阮 元", "d": "清", "v": "古人诗词集萃", "b": "正山堂诗词·甲辰集", "w": ["又向山堂自煮茶， 木棉花下见桃花。", "地偏心远聊爲隐， 海阔天空不受遮。", "儒士有林真古茂， 文人同苑最清华。", "六班千片新芽緑， 可是春前白傅家。", "卷六 附录（三则）", "茶道“清雅和”", "纪宝成", "习近平总书记提出的 “要把茶文化、茶产业、茶科技统筹起来”的思想，不仅对茶界、农界，而且对文化艺术界、诗词界，都是巨大的鼓舞。习总书记把茶文化排在“三茶”统筹的首位，突显了文化的重要价值。优秀的文化是历史传承的血脉，为经济社会的发展提供精神动力、人才支撑和智力支持。", "从茶文化内在的涵义来看，既有庙堂之高，又有学府之深，也有市井生活的方方面面。而茶诗词则是茶文化与人们生活之间的桥梁，既描绘柴米油盐酱醋茶的日常生活，又吟咏琴棋书画诗酒茶的文化情趣。", "这本《正山堂诗词·壬寅集》收集了江元勋先生的讲话片段，他提到要拿回红茶的话语权，提到精益求精、粗活细干，提到茶是一草一木一人，人在草木间，感恩自然等等，体现了茶人的主人翁精神，奉献、奋斗、创新的精神，比如金骏眉就创新了红茶新世代，这些就是茶文化的重要内容。", "茶文化还包括生产经营中的思想理念，比如天人合一，共同富裕，诚信经营，周全待客等理念，以及相关的产地、工艺、产品、营销等，这些是茶的生产经营文化。", "茶人和茶友在制茶、品茶、饮茶、论茶等茶的生产消费的过程中，不断追求精神境界和生活情趣，形成“清、雅、和”的茶道精神。", "所谓“清”，一方面意味着干净、纯净、澄澈，一方面意味着清静、安静、清欢，同时也包含清廉、清正之意。", "所谓“雅”，是雅量、雅致，意味着纯正而不歪邪，高尚而不庸俗，美好而不粗鄙，宽宏而不狭隘。", "所谓“和”，是谦和、温和、和气，能够互相尊重，和谐共赢，也意味着和实生物，同则不继，中和位育。茶文化追求“和”的境界，不要到处紧绷绷的，大家都和气生财。", "总之，茶道“清、雅、和”，体现的是中华优秀文化的思想理念，是茶文化的精华和气韵。", "——摘编自2022年8月21日作者在《正山堂诗词·壬寅集》首发仪式暨武夷山茶诗词交流会上的发言。题目为编者所加。", "立中国标准 做世界品牌", "江元勋", "我是来自福建南平武夷山的江元勋。我的家乡，是位于武夷山国家级自然保护区内的桐木村。我从小是在茶叶的氛围中长大，十几岁的时候，就跟父辈上山采茶，也开始学习做茶。", "大约在明末清初，桐木村产生了一种新的茶类，就是正山小种红茶。这种红茶目前考证，是世界上最早的红茶。后来经过一些传教士和商人们传到了欧洲，在英国皇室和贵族当中流行起来，形成了他们的下午茶文化。我原本一直从事的就是正山小种红茶的制作。2005年，我跟团队一起，对正山小种的制作进行改良，用桐木村高山茶叶的芽尖作为原料，又研发出了一种新的红茶。这就是现在已经广为人知的“金骏眉”。", "金骏眉是一种新的红茶工艺。相比过去的红茶制作，无论在原料选择、委凋、发酵工艺还是干燥设备上，都有比较大的改良和提升。原来传统的红茶虽然也很好，但也有一些缺点，就是外形比较大，略有粗糙之感，口味和口感也偏于浓厚和苦涩。金骏眉改变了这个缺点，它的外形细致、紧密，色泽黑中带黄，很亮丽，看起来就很好看。它的香气，则是带有一种高山的韵味和花果香，味道没有苦涩感，入口醇厚甘甜，让人回味无穷。", "金骏眉是根植于传统正山小种红茶制作技艺的一项创新，自诞生以后，就受到了社会上广泛的欢迎和积极的回响。“问渠那得清如许，为有源头活水来。”金骏眉是工艺的创新，但也是根植于我国优秀茶文化和源远流长的红茶制作技艺，也是得益于武夷山桐木关得天独厚的茶树生长环境，并不仅仅是属于我个人的独得之秘。", "因此，从2010年开始，我们突破地域限制，在全国范围内严选十个优质红茶产区，向他们奉献出金骏眉红茶的制作技艺和管理经验，结合当地生态人文和资源情况，研发创造新的特色红茶产品。先后与河南信阳、浙江绍兴、贵州普安、四川广元、湖北巴东、湖南古丈、福建武夷山、山东诸城的茶区政府和企业开展合作，研发创制出了“信阳红”“会稽红”“普安红”“广元红”“巴东红”“古丈红”“骏眉红”“超然红”等一系列高质量红茶，不仅有效带动了当地茶区茶农增产增收，也促进了当地乡村振兴事业和茶产业的可持续发展。并制定了骏眉红茶标准，这就是我们目前正在进行的全国红茶产业布局，本着“立中国标准，做世界品牌”这样一个事业。", "以上是我对自己的一个简单介绍。君子务本，本立而道生。我是生长在武夷山的茶农。从我出生到现在，几十年如一日，都是与茶叶打交道。学习传承、研究创新红茶制作技艺，使红茶的制作日益精湛成熟，让红茶在更多层面上受到更多人的喜爱，让红茶文化更加深入人心，这是我最热爱的事情，也是我的本分事。", "感恩生活在今天中华民族走向全面复兴的伟大时代，感恩党和政府对我的信任和肯定，我感到十分荣幸和责任重大。我们南平武夷山的先贤朱熹有句话说：“守正直而佩仁义。”我将不断认真学习、领会党的政策，不断继续努力，用实际行动反馈党的恩情，争取在我国红茶制作技艺的提升和推广方面做出更多、更大的贡献，助力乡村振兴事业和伟大的中国式现代化进程。", "——摘自作者在2023年3月十四届全国人大一次会议期间的发言。题目为编者所加。", "红茶产业链需标准化引领", "卢福永 江志东 徐庆生", "中国红茶产业具有实施全产业链标准化发展的现实基础,同时也有急迫的标准化发展需求。中国茶产业要实现融合式发展,必须走现代化产业发展道路,以标准化和适度规模化为核心手段,并在技术工艺环节较复杂的红茶领域去实施和推广,重构茶产业的发展格局。", "红茶产业标准化发展对生产部门、流通部门和消费部门都有积极效应。", "第一,红茶产业标准化发展可以显著提升生产商的收入、产品质量和品牌知名度,从而避免生产高质量产品的生产商被逆淘汰,稳定产品质量,提升品牌的市场认可度和知名度;并且对在线和线下产品销售和品牌形象均有显著的提升作用，尤其对在线下销售产品的生产商正向影响效应更为显著。", "第二,标准化发展对流通企业总体上具有显著的正向影响效应,提升了流通企业的经济效益和消费者的品牌认可度，但影响效应具有一定的异质性。", "第三，标准化发展提升了消费者效用水平，改善了消费体验，提升了消费者对品牌的认可度，消费者提高了对高标准化产品的复购率，但同样在不同的产品中体现了异质性。", "第四，红茶产业全产业链的标准化发展不仅具有显著的经济和市场正向促进效应，还具有明显的社会效益，对种植端的农业参与者具有明显的正效应。", "——摘编自《红茶产业链标准化发展问题研究》（吉林科学技术出版社，2021年12月）前言。题目为编者所加。", "编后记", "在《正山堂诗词》（2020年）、《正山堂诗词·壬寅集》（2022年）先后出版的基础上，《正山堂诗词·甲辰集》即将付梓，这三本书可谓“正山堂诗词三部曲”。", "《正山堂诗词·甲辰集》收录诗词183首，依惯例分为古风、绝句、律诗、词及古人咏茶诗词五卷，另附文3篇。每卷中仍作者以姓氏笔划排序，同一作者以作品创作时间排序，古人以生年先后排序。", "本书得到了广大作者的热情参与。江志东、侯书栋、宋振锟、夏春莉等参加了具体编辑工作。中华诗词学会、广陵书社、扬州古籍线装文化有限公司等给予了大力支持。", "希望茶诗词、茶文化得到越来越多读者的喜爱！", "编者"], "n": [], "k": "2024年4月", "g": "诗", "cp": ["金骏眉", "正山小种", "超然红", "古丈红", "巴东红", "普安红", "信阳红"], "rg": ["骏眉红·武夷山", "信阳红", "巴东红", "古丈红", "会稽红", "广元红", "普安红", "超然红"], "tp": "采茶制茶", "season": ["春", "夏"], "jq": [], "cpai": "", "st": "七古"}, {"t": "水调歌头·金骏眉", "a": "丁纯", "d": "当代", "v": "未分卷", "b": "金骏眉诗词集", "w": ["茶美有清气，灵秀沁眉弯。得来多少真意，勾起月弦弹。", "汲取云天正气，坦荡人生堪寄，雅韵亦翩然。时代风华展，春", "色映雄关。", "驰骏影，腾香雾，净尘寰。初心一片融入，叠叠泛金澜。", "不负相思日夜，早把深缘缔结，盛世享清欢。已带情如许，梦", "至武夷巅。"], "n": [], "k": "", "g": "词", "cp": ["金骏眉"], "rg": ["骏眉红·武夷山"], "tp": "咏茶", "season": ["春"], "jq": [], "cpai": "水调歌头", "st": "词"}, {"t": "金骏眉", "a": "丁欣", "d": "当代", "v": "未分卷", "b": "金骏眉诗词集", "w": ["泉汲溪光满，香生岩骨多。", "玉杯腾紫气，锡罐泻金波。", "心静疏星落，眉舒明月过。", "还呼二三子，轻啜向云窠。"], "n": [], "k": "", "g": "诗", "cp": ["金骏眉"], : "正山堂诗词·壬寅集", "w": ["武夷自古育名茶，桐木春深遍迩遐。", "琥珀生香氤细蕊，琉璃弄色沁金芽。", "低冲碗转眉间索，慢品杯开舌底花。", "甘苦由心人世味，涤清俗骨待陈槎。"], "n": [], "k": "二〇二一年七月于沈阳", "g": "诗", "cp": ["金骏眉"], "rg": ["骏眉红·武夷山"], "tp": "品茶", "season": ["春"], "jq": [], "cpai": "", "st": "七律"}, {"t": "纪宝成江元勋◎主编", "a": "壬寅集", "d": "当代", "v": "律诗", "b": "正山堂诗词·壬寅集", "w": ["诗词", "中国·扬州", "下册"], "n": [], "k": "", "g": "诗", "cp": [], "rg": [], "tp": "其他", "season": [], "jq": [], "cpai": "", "st": "七绝"}, {"t": "青玉案·九曲溪听人诵《茶经》", "a": "丁欣", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["琴筝乍起花如雨，听传唱、芳菲句。溪上飞香从陆羽，联青", "浮翠，吐芽舒叶，争作春风主。", "清吟渐渐波心去，散落茶云满芳渚。客在亭廊幽曲处，执壶", "铺盏，汲泉烹雪，把个闲情注。"], "n": [], "k": "二〇二一年十一月六日于江苏溧阳", "g": "词", "cp": [], "rg": [], "tp": "咏茶", "season": ["春"], "jq": [], "cpai": "青玉案", "st": "词"}, {"t": "东风第一枝·题正山堂巴东红", "a": "王月芳", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["一盏幽香，三分清气，浑如琥珀闲拥。三千重翠云生，八百", "里巴东梦。岚浮青嶂，漫听取、武陵歌送。素手飞，摘得灵芽，", "焙作骏眉香涌。", "觅根源，神农独懂。究盛名，自唐专贡。匠心桐木相承，厚", "韵正山与共。汲来泉水，新茗煮、诗随风动。两腋清，一任长吟，", "一任激怀长纵。"], "n": [], "k": "二〇二〇年十一月二十六日于山东威海", "g": "词", "cp": ["巴东红"], "rg": ["骏眉红·武夷山", "巴东红"], "tp": "咏茶", "season": [], "jq": [], "cpai": "东风第一枝", "st": "词"}, {"t": "沁园春·骏眉中国", "a": "王凤祥", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["桐木熏风，云雾缠萦，九曲水长。望瑶枝新叶，株株竞秀；", "蜜蜂彩蝶，款款而翔。红袂飘悠，绿丛采撷，悦耳茶歌飞远乡。", "高端业，叹骏眉中国，越发辉煌。", "武夷神话传扬，引小种分支倾四方。喜绒毛纤细，嫩芽鲜活；", "茶汤静雅，色泽金黄。入口甘甜，满喉清爽，禅韵绵绵久驻香。", "闲人事，正驰心品味，荡气回肠。"], "n": [], "k": "二〇二〇年十二月五日于江苏泰州", "g": "词", "cp": ["骏眉中国"], "rg": ["骏眉红·武夷山"], "tp": "咏茶", "season": ["春"], "jq": [], "cpai": "沁园春", "st": "词"}, {"t": "鹧鸪天·正山小种", "a": "毛瑞花", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["谁种清香一味真，正山茶里聚精神。沉浮故事凭君品，澹荡", "胸襟任我存。", "烹玉露，浣冰魂，壶中自有大乾坤。浮生不问名和利，素手", "常煎万盏春。"], "n": [], "k": "二〇二一年十二月二十日于河南", "g": "词", "cp": ["正山小种"], "rg": [], "tp": "咏茶", "season": ["春"], "jq": [], "cpai": "鹧鸪天", "st": "词"}, {"t": "八声甘州·古丈红", "a": "仇恒儒", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["数湘西四望最清嘉，千古出奇珍。借骏眉鸿笔，龙睛一点，", "便起风云。巧把正山梦韵，谱入布依春。一泡金波漾，香领乾坤。", "每向武陵问道，煮沉浮几度，一叶归真。悟人生况味，解语", "是清纯。品旧岁、顿生禅意，啜未来、酣畅涤心尘。陶陶也，若", "云霞外，抒啸昆仑。"], "n": [], "k": "二〇二〇年十二月二十二日于江苏滨海", "g": "词", "cp": ["古丈红"], "rg": ["古丈红"], "tp": "其他", "season": ["春"], "jq": [], "cpai": "八声甘州", "st": "词"}, {"t": "一剪梅·饮金骏眉遣怀", "a": "丘尾菊", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["金骏眉香染素笺。风语轻轻，月影弯弯。百般况味在壶中，", "几许沧桑，几许缠绵。", "谁与清欢度锦年。一盏琼浆，浮梦如烟。茶香飘处寄情浓，", "半入诗行，半上眉间。"], "n": [], "k": "二〇二一年七月十五日于广东深圳", "g": "词", "cp": ["金骏眉"], "rg": [], "tp": "抒怀感怀", "season": [], "jq": [], "cpai": "一剪梅", "st": "词"}, {"t": "鹧鸪天·咏金骏眉", "a": "李桃", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["琥珀晶莹映月光，清烟袅袅满庭芳。形兼三色眉山秀，味共", "千峰花露张。", "持玉盏，润诗行，浮沉舒卷韵悠长。嫩芽曾与云霞伴，滤尽", "尘心禅意藏。"], "n": [], "k": "二〇二一年十二月十六日于山西朔州", "g": "词", "cp": ["金骏眉"], "rg": [], "tp": "咏茶", "season": [], "jq": [], "cpai": "鹧鸪天", "st": "词"}, {"t": "眼儿媚·咏中国骏眉", "a": "李文清", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["浓雾桐关骏眉扬。精品正山堂。百年工艺，几番点染，十省", "灵光。", "骏眉茶韵诗吟唱，瑞草赋华章。李桃姿艳，松梅风骨，世代", "流芳。"], "n": [], "k": "二〇二〇年十一月二十八日于吉林大安", "g": "词", "cp": [], "rg": [], "tp": "咏茶", "season": [], "jq": [], "cpai": "眼儿媚", "st": "词"}, {"t": "鹧鸪天·咏金骏眉红茶", "a": "汪东峰", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["千载氤氲香未休，正山金骏展眉头。一腔寄语高朋聚，半亩", "诗田雅韵筹。", "浓墨起，细毫收。勾勾点点尽风流。幽情更系茶仙子，早把", "温馨沏满楼。"], "n": [], "k": "二〇二一年七月于安徽", "g": "词", "cp": ["金骏眉"], "rg": [], "tp": "咏茶", "season": [], "jq": [], "cpai": "鹧鸪天", "st": "词"}, {"t": "行香子·赞正山堂", "a": "武光前", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["小种清香，金骏眉扬，正山堂漫溢芬芳。紫砂温润，九曲甘凉，", "有同心者，知心话，暖心房。", "武夷险峭，桐木轩昂，好儿郎重著华章。元勋主创，雅士匡襄，", "为集茶诗，弘茶道，品茶香。"], "n": [], "k": "二〇二一年九月二十二日于海南海口", "g": "词", "cp": ["金骏眉"], "rg": ["骏眉红·武夷山"], "tp": "咏茶", "season": [], "jq": [], "cpai": "行香子", "st": "词"}, {"t": "踏莎行·品金骏眉", "a": "周栎", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["碧叶流香，紫砂腾雾。金黄欲滴娇含露。甘甜温润细无声，", "恰如春夜丝丝雨。", "人渐销魂，心堪飞鹭。梦中隐约闻禅语。便邀陆羽品灵芽，", "武夷山上长歌去。"], "n": [], "k": "二〇二一年七月四日于湖北荆州", "g": "词", "cp": ["金骏眉"], "rg": ["骏眉红·武夷山"], "tp": "品茶", "season": ["春"], "jq": [], "cpai": "踏莎行", "st": "词"}, {"t": "踏莎行·咏正山小种红茶", "a": "周栎", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["芽细如眉，身轻怕雪。岚烟遮目还招蝶。春深谷雨盼君来，", "千般娇嫩情难歇。", "色透金黄，味尤甘洌。销魂梦里飞天阙。劝娥莫啜正山红，", "当心悔恨留明月。"], "n": ["怕雪，指金骏眉怕寒的特性。", "谷雨，采春茶一般在谷雨时节。", "君，这里指采茶人。娥，嫦娥。"], "k": "二〇二一年十一月三日于湖北荆州", "g": "词", "cp": ["金骏眉", "正山小种", "正山红茶"], "rg": [], "tp": "咏茶", "season": ["春"], "jq": ["谷雨"], "cpai": "踏莎行", "st": "词"}, {"t": "沁园春·正山堂普安红", "a": "承洁", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["十里清香，根系武夷，客醉普安。看注：陆羽的《茶经》是世", "界第一部茶叶专著。晋左", "乌蒙峰顶，四球茶绝；丹青册上，独占名思，字太冲，作《娇女诗》，", "贤。摘叶闻香，揉芽旋索，匀黛娥眉教客牵。诗中有茶事场景。", "红炉试，那胭脂醉雨，西子容颜。于江苏江阴", "应知世界茶源，漫数得韶华百万年。", "叹经书陆子，先河引领；太冲《娇女》，开", "拓新篇。醉听松风，醉看岚雾，绝妙风光", "不慕仙。平生事，共玉壶歌咏，一缕茶烟。"], "n": [], "k": "二〇二〇年十一月二十五日", "g": "词", "cp": ["普安红"], "rg": ["骏眉红·武夷山", "普安红"], "tp": "其他", "season": ["春"], "jq": [], "cpai": "沁园春", "st": "词"}, {"t": "眼儿媚·咏茶", "a": "胡志军", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["茶韵琴音碧霞衣，几度赋神奇。一番辛苦，百般磨砺，十地", "虹霓。", "伴诗伴酒春风醉，背影共香移。幽篁独坐，相思缕缕，余味", "离离。"], "n": [], "k": "二〇二〇年十一月二十八日于吉林大安", "g": "词", "cp": [], "rg": [], "tp": "咏茶", "season": ["春"], "jq": [], "cpai": "眼儿媚", "st": "词"}, {"t": "小重山·武夷茶韵", "a": "胡志军", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["春色何时染武夷。好将神韵取、做新衣。香飘十地翠离离。", "诱魂起、单等付佳期。", "泼墨画传奇。高山流雅意、正痴迷。浮沉万里醉心机。情切切、", "知己共依依。"], "n": [], "k": "二〇二一年七月于吉林大安", "g": "词", "cp": [], "rg": ["骏眉红·武夷山"], "tp": "咏茶", "season": ["春"], "jq": [], "cpai": "小重山", "st": "词"}, {"t": "定风波·桐木正山金骏眉", "a": "纪福华", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["灶火熏红桐木关，茶香阵阵气冲天。陆羽察微神仙饮，极品，", "难追金骏煮灵泉。", "许是武夷禅性滴，妙极，一山装下万山禅。佛趁洗心兼涤性，", "化境，小壶漫品悟尘寰。"], "n": [], "k": "二〇二一年七月于上海", "g": "词", "cp": ["金骏眉"], "rg": ["骏眉红·武夷山"], "tp": "咏茶", "season": [], "jq": [], "cpai": "定风波", "st": "词"}, {"t": "蝶恋花·与远清同志品茶朝天门", "a": "纪宝成", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["偶作朝天门上客，闲品新茶，靠椅藏舒适。悦目嘉陵窗下碧，", "两江交汇东流急。", "对坐悠悠言改革，岁月如流，甘苦心头织。数载辛劳争晓夕，", "赢来一派生机勃。"], "n": [], "k": "二○○○年六月一至二日于成都—郑州—北京航班途中", "g": "词", "cp": [], "rg": [], "tp": "品茶", "season": [], "jq": [], "cpai": "蝶恋花", "st": "词"}, {"t": "清平乐·小聚品花赏春", "a": "纪宝成", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["午后一众好友同事来我家观赏盛开之樱桃花、樱花、榆叶梅，共享大好春光，其", "乐也融融。", "温阳灿烂，小聚欢声乱。不赏春光非好汉，纵有千金不换。", "三杯两盏新茶，诗书满腹芳华。眼接一行杨柳，窗含满树樱花。"], "n": [], "k": "二〇一三年四月十五日傍晚于北京百旺家苑笑闹斋", "g": "词", "cp": [], "rg": [], "tp": "品茶", "season": ["春"], "jq": [], "cpai": "清平乐", "st": "词"}, {"t": "鹤冲天·品茶西堤", "a": "纪宝成", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["今晨偕妻祖英入颐和园，漫步西堤后会同友人品茶于堤边船形茶室，清谈甚欢。", "临碧水，傍西堤，天远绿荫迷。一船茶室客人稀，难得俗尘离。", "窗远眺，湖浩渺，水面闪银浮照。闲心闲话话闲题，谈笑付", "清漪。"], "n": [], "k": "二〇一三年六月十八日下午于北京百旺家苑乐斋", "g": "词", "cp": [], "rg": [], "tp": "品茶", "season": [], "jq": [], "cpai": "鹤冲天", "st": "词"}, {"t": "醉花阴·宾客盈门", "a": "纪宝成", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["过却大寒冬渐老，寒舍春来早。贵重一相逢，几净窗明，绿", "植盈盈笑。", "香茶细品归安好，有漫吟轻啸。莫道不消魂，乐事良辰，了", "矣何曾了！"], "n": [], "k": "二〇一六年一月三十一日夜晚于北京百旺家苑乐斋", "g": "词", "cp": [], "rg": [], "tp": "品茶", "season": ["春", "冬"], "jq": ["大寒"], "cpai": "醉花阴", "st": "词"}, {"t": "摊破浣溪沙·诗评历代词人八十家完稿", "a": "纪宝成", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["三月七日，以七绝近体诗选评历代词人八十家完稿搁笔。甚喜。", "七绝歌评八十家，随心缘趣撷芳华。词史从来应罕有，可堪夸？", "恰似叠书穿往古，浑如斗室走天涯。南北笔耕谁伴我？一壶茶。"], "n": ["南北，指京城、椰城两地。"], "k": "二〇二〇年三月九日凌晨于北京百旺家苑乐斋", "g": "词", "cp": [], "rg": [], "tp": "其他", "season": [], "jq": [], "cpai": "摊破浣溪沙", "st": "词"}, {"t": "生查子·签名《正山堂诗词》", "a": "纪宝成", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["嘉宾排队来，笑满盈盈脸。衹为要签名，喜捧新书卷。", "天人有共鸣，雅逸清欢献。一叶韵千秋，饮者身心健。"], "n": ["四月八日上午，在南京绿地洲际酒店举办", "的“《正山堂诗词》出版交流会”茶歇和散会时，", "与会嘉宾纷纷请笔者签名该书以作纪念。"], "k": "二〇二一年四月八日夜晚于南京绿地洲际酒店", "g": "词", "cp": [], "rg": [], "tp": "其他", "season": ["秋"], "jq": [], "cpai": "生查子", "st": "词"}, {"t": "满江红·黔西鄂西山区行", "a": "纪宝成", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["六月中下旬间，笔者应邀随同福建正山堂茶叶有限公司董事长江元勋一行，察访", "该公司合作支援贵州普安、湖北巴东等地正山堂工艺红茶生产情况，感山乡巨变，茶", "香人和，因填此调以为记。", "起伏群山，连天去、竞争翠碧。油路爽、破岩穿水，险危历历。", "其实平安宽大道，已然富庶新标的。抬望眼、精舍乐农家，欢声溢。", "从来事，循有律；当务实，争朝夕。踏关山传艺，几多心力！", "济困扶贫收实效，兴乡焕野圆功绩。笑谈中、一路正山堂，身心逸。"], "n": [], "k": "二〇二一年七月七日清晨于北京乐斋", "g": "词", "cp": ["巴东红", "普安红"], "rg": ["巴东红", "普安红"], "tp": "其他", "season": [], "jq": [], "cpai": "满江红", "st": "词"}, {"t": "淡柳·吃茶去", "a": "纪宝成", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["秋凉渐起，相约园中步。莫问人间今或古。意气知音你我，", "宜在湖边唱《渔父》。", "吃茶去，偷闲享清趣。敬杯举，总相互。喜清风两腋卢仝悟。", "玉叶香芽，爽喉醇舌，殊贵轻言细诉。"], "n": [], "k": "二〇二一年八月三十日深夜于北京乐斋", "g": "词", "cp": [], "rg": [], "tp": "咏茶", "season": ["秋"], "jq": [], "cpai": "淡柳", "st": "词"}, {"t": "行香子·感怀", "a": "徐伟", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["池印风痕，霜见秋深。伴月影、金兽香焚。忽逢禅意，暗启", "灵门。正书中句，心中意，镜中身。", "檀案无尘，茗叶垂针。拈青盏、激荡浮沉。弦停留韵，梦醒", "余温。念今时逸，他时诺，旧时人。"], "n": ["以“霜降”“啜茗”为主题，", "与崔希亮先生隔空唱和一首。"], "k": "二〇二一年十月二十二日于北京", "g": "词", "cp": [], "rg": [], "tp": "抒怀感怀", "season": ["秋"], "jq": ["霜降"], "cpai": "行香子", "st": "词"}, {"t": "行香子·正山堂超然红", "a": "徐俊丽", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["世外悠闲，月下氤氲。得超然方得灵根。千山叠翠，不染纤尘。", "采一钱风，三钱露，五钱云。", "可餐秀色，能医俗骨。啜茶汤舌底生津。杯中尤物，谁与相亲。", "有刘公书，苏公画，窦公文。"], "n": ["刘公指刘墉，有“浓墨宰相”之称。窦", "公指窦光鼐，一代帝王之师，二人皆为诸城", "人。苏公指苏轼，他在知密州时修建超然台。"], "k": "二〇二一年十二月二十七日于山东潍坊", "g": "词", "cp": ["超然红"], "rg": ["超然红"], "tp": "风景山水", "season": [], "jq": [], "cpai": "行香子", "st": "词"}, {"t": "西江月·独品", "a": "徐艳丽", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["独对红汤翻浪，静观香叶浮沉。亦舒亦卷亦禅心。可奉诗书", "佐饮。", "一撮正山小种，乾坤碗里精深。松烟熏过是光阴。况味宜当", "细品。"], "n": [], "k": "二〇二〇年十二月三十日于吉林大安扫眉斋", "g": "词", "cp": ["正山小种"], "rg": [], "tp": "品茶", "season": [], "jq": [], "cpai": "西江月", "st": "词"}, {"t": "江城子·品茶", "a": "郭德萍", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["清茶煮出带乡愁，把千秋，注心头。多少沉浮，尽在一金瓯。", "陶醉人间山水色，情已动，意难收。", "斟来梦想莫勾留，有追求，自风流。蕴藉精神，不改是温柔。", "能沁襟怀能沁月，生雅韵，任回眸。"], "n": [], "k": "二〇二一年十二月十五日于黑龙江齐齐哈尔", "g": "词", "cp": [], "rg": [], "tp": "品茶", "season": ["秋"], "jq": [], "cpai": "江城子", "st": "词"}, {"t": "凤凰台上忆吹箫·咏正山茶", "a": "陈东彩", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["桐木关前，武夷山下，令名堪溯前因。久誉满，三千里外，", "四百余春。时雨明前轻洒，漫润得，遍野芽新。柔荑撷，盈筐翠玉，", "都是春魂。", "闲约嘉宾三五，生活火、汲泉围坐花茵。慢烹就，芬芳味厚，", "琥珀光匀。饮罢仙津七碗，齿颊香，清骨怡神。恍然觉，飘飘欲", "脱凡尘。"], "n": [], "k": "二〇二〇年十一月十八日于广东广州", "g": "词", "cp": [], "rg": ["骏眉红·武夷山"], "tp": "咏茶", "season": ["春"], "jq": [], "cpai": "凤凰台上忆吹箫", "st": "词"}, {"t": "南歌子·谢友寄正山堂巴东红", "a": "陈发彬", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["此地留名久，神农百草篇。巴东灵气蕴飞仙。四道茶中歌舞，", "云雨高山。", "盛意随春到，浮瓯细乳鲜。素杯清饮最心欢。留齿清幽香气，", "换了人间。"], "n": ["四道茶，系土家迎客茶礼。"], "k": "二〇二〇年十月二十九日于辽宁盘锦", "g": "词", "cp": ["巴东红"], "rg": ["巴东红"], "tp": "赠答酬和", "season": ["春"], "jq": [], "cpai": "南歌子", "st": "词"}, {"t": "薄幸·桐木关品金骏眉", "a": "眭珊", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["茗烟飘渺。对千亩、仙茶碧绕。憩九曲、桐关清境，竹影松", "风悄悄。看莺飞、流水涓涓，婆娑万缕杯中袅。浥槛外尘埃，云", "间岁月，沉淀红尘几道？", "斟玉盏、轻轻啜，任爽馥、唇滋舌挑。似风生两腋，醇舒百窍，", "朱衣紫绶浑忘了。最萦怀抱。是黄岗峰上，流光漫煮人间小。浮", "生欲品，须趁萧娘未老。"], "n": [], "k": "二〇二一年七月二十九日于广西柳州", "g": "词", "cp": ["金骏眉"], "rg": ["骏眉红·武夷山"], "tp": "品茶", "season": [], "jq": [], "cpai": "薄幸", "st": "词"}, {"t": "踏莎行·题武夷山金骏眉", "a": "眭珊", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["桐木烟霞，黄岗云雾。青山绿水深深处。芳林采得武夷春，", "眉尖犹带杨枝露。", "恬澹新芽，澄泓雪乳。悠悠漫把流光煮。氤氲涤尽世间愁，", "禅香一盏蓬壶渡。"], "n": [], "k": "二〇二一年十二月三十一日于广西南宁", "g": "词", "cp": ["金骏眉"], "rg": ["骏眉红·武夷山"], "tp": "咏茶", "season": ["春"], "jq": [], "cpai": "踏莎行", "st": "词"}, {"t": "卜算子·禅茶", "a": "闫赵玉", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["瓷盏贮岩泉，古木连潭碧。今日相逢且斗茶，人境尘氛隔。", "乘兴叩禅关，皓月连天白。回望秋山满冷霜，落叶空行迹。"], "n": [], "k": "二〇二一年七月二十九日于河南周口", "g": "词", "cp": [], "rg": [], "tp": "咏茶", "season": ["秋"], "jq": [], "cpai": "卜算子", "st": "词"}, {"t": "卜算子·山中饮茶", "a": "闫赵玉", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["花落在吾杯，春草和天碧。谷雨吹香霁景新，且试寒泉汲。", "邀月饮清风，兴味凭谁识。放棹渔人若问津，此是桃源陌。"], "n": [], "k": "二〇二一年十一月三日于河南周口", "g": "词", "cp": [], "rg": [], "tp": "品茶", "season": ["春"], "jq": ["谷雨"], "cpai": "卜算子", "st": "词"}, {"t": "东风第一枝·游武夷山金骏眉生产基地", "a": "张琳", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["闽岭云轻，武夷风软，春生嘉木眉叶。和烟摘得灵芽，带露", "归来凉月。苍苔轻覆，汲新泉、青瓷冰冽。看雾起、煮茗台边，", "最喜二三香发。", "记峰顶、松涛响彻。念翠微、溪声咏切。清歌袅袅犹回，玉", "指纤纤还拂。明年重到，料一瓯、可消思渴。又恍惚、琥珀光浮，", "解道世间清绝。"], "n": [], "k": "二〇二一年七月于重庆", "g": "词", "cp": ["金骏眉"], "rg": ["骏眉红·武夷山"], "tp": "纪游访茶", "season": ["春"], "jq": [], "cpai": "东风第一枝", "st": "词"}, {"t": "水调歌头·咏金骏眉", "a": "张海萍", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["未品心先醉，杯里是乡情。涤神荡气，闻香也觉一身轻。几许", "风云融入，多少禅缘悟出，世事水中平。看透沉浮后，斟满好前行。", "蕴今古，融真善，自娉婷。凝涵华夏文化，诗意已飞腾。今古", "相通淡定，物我相知气敛，清韵许今生。日月焙成梦，叶叶共争鸣。"], "n": [], "k": "二〇二一年七月十六日于黑龙江富锦", "g": "词", "cp": ["金骏眉"], "rg": [], "tp": "咏茶", "season": ["夏"], "jq": [], "cpai": "水调歌头", "st": "词"}, {"t": "临江仙·诗意正山堂", "a": "程良宝", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["四百年来酬雅韵，杯杯荡漾诗声。正山堂里梦魂萦。名牌开", "愿景，特色亮新星。", "守信求真崇品位，口碑就是高评。初心不改铸精英。今来寻", "味道，慢饮好心情。"], "n": [], "k": "二〇二一年七月十八日于陕西延安黄陵", "g": "词", "cp": [], "rg": [], "tp": "其他", "season": [], "jq": [], "cpai": "临江仙", "st": "词"}, {"t": "浣溪沙·茗坐", "a": "冯汉斌", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["谁谓阳芽最好烹，悠然轻抿意偏倾。从谂半语动高情。", "暂摒凡尘忘百虑，且随金叶唱三更。氤氲醉梦泼茶声。"], "n": [], "k": "二〇二〇年六月于湖北宜昌", "g": "词", "cp": [], "rg": [], "tp": "其他", "season": [], "jq": [], "cpai": "浣溪沙", "st": "词"}, {"t": "捣练子·茶谊", "a": "杨玲玲", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["佳客至，绿茶呈，素手青盅献友人。此刻愿和君一处，饮甘", "茹苦共销魂。"], "n": [], "k": "一九八二年四月六日于咸宁浮山", "g": "词", "cp": [], "rg": [], "tp": "咏茶", "season": [], "jq": [], "cpai": "捣练子", "st": "词"}, {"t": "唐多令·茶计", "a": "杨玲玲", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["清露半瓯留。寒蝉百韵收。伴萧条、衰柳添愁。夫子打工犹", "未返，过几日、便中秋。", "应未合盲流。归来再运筹。垦荒山、广有西畴。种植茗柯能", "获利，何必去、异乡求？"], "n": [], "k": "一九八二年九月六日于宜昌德耕园", "g": "词", "cp": [], "rg": [], "tp": "咏茶", "season": ["秋"], "jq": [], "cpai": "唐多令", "st": "词"}, {"t": "喝火令·茶缘", "a": "杨玲玲", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["煮茗情依旧，结缘债已深。岭前云水洗风尘。恢复往年心性，", "故里好追寻。", "入夜悲闻笛，因风暗转身。再呈玄液润精神。问也无言，问", "也弄衣襟。问也不曾相告，悉付满天星。"], "n": [], "k": "一九九二年九月六日于咸宁马桥", "g": "词", "cp": [], "rg": [], "tp": "咏茶", "season": [], "jq": [], "cpai": "喝火令", "st": "词"}, {"t": "行香子·茶怨", "a": "杨玲玲", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["算就归期，长望河堤。数闲花、已近东溪。霞收日影，鸭进", "藩篱。渐人声远，鸟声寂，犬声稀。", "频频推理，懒懒宽衣。若多话、却听乌啼。老茶伴我，玄液", "成医。治中宵醒，春宵苦，冷宵凄。"], "n": [], "k": "一九九九年八月十五日于宜昌车溪人家", "g": "词", "cp": [], "rg": [], "tp": "咏茶", "season": ["春"], "jq": [], "cpai": "行香子", "st": "词"}, {"t": "长相思·茶恋", "a": "杨玲玲", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["明相思，暗相思。三峡姑娘知不知？去年贾茗时。", "说相思，诉相思。短信频飞迟不迟？夜深人半痴。"], "n": [], "k": "二〇一〇年五月三日于宜昌三峡人家", "g": "词", "cp": [], "rg": [], "tp": "咏茶", "season": [], "jq": [], "cpai": "长相思", "st": "词"}, {"t": "凤凰台上忆吹箫·茶魂", "a": "杨玲玲", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["煎滚玄汤，礼呈佳客，一壶涤尽尘劳。便几多愁怨，悉散云霄。", "将爽心奇乐事，评说处、笑语如潮。添良友，因呼内室，再斩砖雕。", "娇娇，走来绝色，轻托那檀盘，袅袅摇摇。更细腰柔软，眉", "眼高标。言语人前清雅，传馥郁、退步悄悄。悄悄去，香留我心，", "数度虚撩。"], "n": [], "k": "二〇一〇年八月一日于咸宁太乙观", "g": "词", "cp": [], "rg": [], "tp": "咏茶", "season": [], "jq": [], "cpai": "凤凰台上忆吹箫", "st": "词"}, {"t": "忆旧游·茶友", "a": "杨玲玲", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["宅居邻圣地，久染祥氛，初迓良俦。煮茗灵泉沸，待汤呈琥珀，", "献与清流。石几得趣长饮，松下绿荫稠。笑野老癫狂，吹唇举盏，", "戏引斑鸠。", "悠悠。拟归去，纵道德无为，尘事难休。记取松云路，莫因", "家缠足，遗忘山丘。青砖净置陶釜，柴灶候君求。谱一曲清词，", "长箫送韵无尽头。"], "n": [], "k": "二〇一〇年十月十八日于武汉木兰山", "g": "词", "cp": [], "rg": [], "tp": "纪游访茶", "season": [], "jq": [], "cpai": "忆旧游", "st": "词"}, {"t": "鹧鸪天·金骏眉吟", "a": "杨海波", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["螺黛青云紫谷藏，武夷春萃正山堂。风情万种骏眉秀，岭雨", "千丝岩骨芳。", "兰溪水、美人妆，金毫入盏溢霞光。乡愁遥寄桐关月，诗句", "吟红韵味长。"], "n": [], "k": "二〇二一年十二月三十一日于江苏连云港", "g": "词", "cp": ["金骏眉"], "rg": ["骏眉红·武夷山"], "tp": "咏茶", "season": ["春"], "jq": [], "cpai": "鹧鸪天", "st": "词"}, {"t": "鹧鸪天·农家品茶", "a": "杨业胜", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["半世无为衹爱茶，牵魂依旧是农家。春天惊喜三分绿，谷雨", "轻拈几片芽。", "茶作酒，话无遮。清香在口好年华。身居闹市寻幽处，袅袅", "云烟挂树丫。"], "n": [], "k": "二〇二一年十二月十一日于河南", "g": "词", "cp": [], "rg": [], "tp": "品茶", "season": ["春"], "jq": ["谷雨"], "cpai": "鹧鸪天", "st": "词"}, {"t": "鹧鸪天·咏武夷山正山堂小种茶", "a": "杨怀胜", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["十万新株翠接黄，凭将妙手法良方。灵芽巧制香穿石，玉韵", "轻烹春在堂。", "添雅趣，转柔肠。透壶月色满庭芳。乡愁总在眉间化，况味", "人生杯底藏。"], "n": [], "k": "二〇二一年十二月二十三日于山西应县", "g": "词", "cp": [], "rg": ["骏眉红·武夷山"], "tp": "咏茶", "season": ["春"], "jq": [], "cpai": "鹧鸪天", "st": "词"}, {"t": "水调歌头·品金骏眉茶感赋", "a": "贾来天", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["煮沸武夷水，舒展看沉浮。昊天后土钟爱，山岭绿金稠。育得", "灵根玉叶，巧手火燃烘焙，香味漫全球。茶亦有言语，漫品自交流。", "饮时尚，涉历史，浸唇喉。天人交汇，眉目齿颊正悠悠。感受", "人间精粹，浸透苍穹禅意，双腋爽风柔。最是动情处，空盏有香留。"], "n": [], "k": "二〇二一年七月初于山东青岛黄岛区", "g": "词", "cp": ["金骏眉"], "rg": ["骏眉红·武夷山"], "tp": "品茶", "season": [], "jq": [], "cpai": "水调歌头", "st": "词"}, {"t": "鹧鸪天·正山堂红茶", "a": "赵国胜", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["谁把红茶做大强？名题金榜正山堂。潜心繁改培良种，高手", "提纯有妙方。", "色鲜艳，味悠长。一杯散尽满庭芳。文人墨客常陶醉，弄笔", "敲诗雅韵张。"], "n": [], "k": "二〇二一年七月于吉林大安", "g": "词", "cp": [], "rg": [], "tp": "咏茶", "season": [], "jq": [], "cpai": "鹧鸪天", "st": "词"}, {"t": "行香子·品金骏眉", "a": "赵晓生", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["天许清嘉，历久弥珍。蕴诗情未饮先醺。琼浆寄兴，美味怡神。", "品三分柔，七分雅，十分醇。", "一壶清茗，千般况味，享悠闲抱朴天真。三生得趣，满室清芬。", "愿人长好，茶长饮，梦长新。"], "n": [], "k": "二〇二一年十二月四日于河北内丘", "g": "词", "cp": ["金骏眉"], "rg": [], "tp": "品茶", "season": [], "jq": [], "cpai": "行香子", "st": "词"}, {"t": "沁园春·骏眉之春", "a": "郑瑞霞", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["极品茶魂，金骏精工，誉起木关。想根生仙境，柔芽灵叶；", "索经绝艺，美质佳颜。烹露壶中，摇光掌上，香气迂回唇齿间。", "皆偏爱，是怡人妙物，天下争传。", "春风携梦云边。九州地，寻缘到碧山。喜各呈芳味，幽林缠", "雾；俱含逸韵，空谷飘烟。赤子情思，骏眉事业，又谱新篇开纪元。", "登高望，看东方龙马，飞遍瀛寰。"], "n": ["木关，桐木关。"], "k": "二〇二〇年十二月二十日于河南新密", "g": "词", "cp": [], "rg": ["骏眉红·武夷山"], "tp": "咏茶", "season": ["春"], "jq": [], "cpai": "沁园春", "st": "词"}, {"t": "行香子·品金骏眉", "a": "郑瑞霞", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["玉碗流芳，素手斟汤。透琥珀、微泛金光。溪山含纳，雨雾", "归藏。品二分醉，三分梦，五分香。", "武夷秀水，桐木兰堂，与诗家、佐饮山乡。素心淡泊，茶味", "悠长。任半生路，几多事，尽相忘。"], "n": [], "k": "二〇二一年七月二十一日于河南郑州", "g": "词", "cp": ["金骏眉"], "rg": ["骏眉红·武夷山"], "tp": "品茶", "season": [], "jq": [], "cpai": "行香子", "st": "词"}, {"t": "行香子·品金骏眉", "a": "郑瑞霞", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["盖上浮烟，壶底生云。烹一轮红月浓春。斜倾玉落，微点金分。", "恰汤盈盏，色成趣，气怡人。", "呷香梦醒，含香情醉，品武夷灵木岚痕。幽藏岩骨，漫逸花氛。", "得茶中味，味中韵，韵中神。"], "n": [], "k": "二〇二一年十二月二十四日于河南", "g": "词", "cp": ["金骏眉"], "rg": ["骏眉红·武夷山"], "tp": "品茶", "season": ["春"], "jq": [], "cpai": "行香子", "st": "词"}, {"t": "念奴娇·咏正山堂茶园", "a": "翟红本", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["佳人婉丽，把流云剪作，轻盈纱服。夕沐月光朝饮露，问是", "哪家矜育？错落依偎，灵心慧质，山势为华屋。春风知己，恣情", "天地吻绿。", "引得陆羽痴狂，著经摛藻，瞭似诗文读。桐木关中高咏客，", "恰共清新无俗。北去南来，欢歌穿雾，幽意粘尘躅。飘飘衣袂，", "带回如海香馥。"], "n": ["经，指《茶经》。"], "k": "二〇二一年十二月二十九日于河南鲁山", "g": "词", "cp": [], "rg": ["骏眉红·武夷山"], "tp": "咏茶", "season": ["春"], "jq": [], "cpai": "念奴娇", "st": "词"}, {"t": "采桑子·加班见秋景", "a": "刘向兵", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["谁携画笔当风舞，天地金黄。一院新妆，柿满枝头菊傲霜。", "莫随骚客悲斯季，秋实洋洋。桃李芬芳，窗下温杯品酽香。"], "n": ["“莫随”句，笔者喜欢刘", "禹锡“自古逢秋悲寂寥，我言", "秋日胜春朝”的情怀。“桃李”句，", "笔者在高校工作。"], "k": "二〇二一年十月三十一日于北京", "g": "词", "cp": [], "rg": [], "tp": "其他", "season": ["春", "秋"], "jq": [], "cpai": "采桑子", "st": "词"}, {"t": "洞仙歌", "a": "卢象贤", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["三间雅室，筑正山堂畔。茶树千株当诗选。趁春时，好雨润", "就新芽，香满苑，差似滋兰九畹。", "拈来金骏叶，敞户闲烹，几缕烟中遂千愿。便已把辋川，移", "入闲庭，时光慢，流年都返。再不拟、尘世约新朋，却见他、闻", "香降来双燕。"], "n": [], "k": "二〇二一年春于福建武夷山", "g": "词", "cp": [], "rg": [], "tp": "咏茶", "season": ["春"], "jq": [], "cpai": "", "st": "词"}, {"t": "点绛唇·品茶", "a": "韩贤锐", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["三抚银筝，颤弦轻按留音住。桃红幽路。村北依林户。", "遣兴煮茶，兴致微酣处。笑不语。和风柔絮。飘向春深去。"], "n": [], "k": "二〇二一年十一月八日于山西吕梁", "g": "词", "cp": [], "rg": [], "tp": "品茶", "season": ["春"], "jq": [], "cpai": "点绛唇", "st": "词"}, {"t": "解佩令·首个国际茶日", "a": "谢秀桐", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["天然不饰，春来自碧。叶生生、连阡横陌。雀舌银眉，趁日出、", "细芽轻摘，辗摇烘、住甘去涩。", "名扬六色，人崇四德。赖神农、千秋遗泽。凤饼龙团，活水烹、", "通禅开魄。沐清和、伟功独赫。"], "n": ["茶依颜色分为绿、白、黑、红、黄与", "乌龙（武夷岩茶、铁观音与台湾乌龙均同", "类）。自古称茶有清、和、简、静四德。"], "k": "二〇二〇年五月二十一日于福建福州", "g": "词", "cp": [], "rg": ["骏眉红·武夷山"], "tp": "咏茶", "season": ["春", "秋"], "jq": [], "cpai": "解佩令", "st": "词"}, {"t": "忆秦娥·品佳茗寄友人", "a": "谢秀桐", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["胭脂柳，清风拂过纤纤手。纤纤手，侵肌夺魄，击人心窦。", "麝馨兰气盈香袖，金汤玉液销眉皱。销眉皱，一壶春色，满", "庭清酎。"], "n": [], "k": "二〇二一年六月二十四日于福建福州", "g": "词", "cp": [], "rg": [], "tp": "赠答酬和", "season": ["春"], "jq": [], "cpai": "忆秦娥", "st": "词"}, {"t": "行香子·武夷品茗", "a": "谢秀桐", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["曲涧青岑，瓦屋篁林。柴门外、隐隐闻琴。茗氛飘缈，逸韵", "斜侵。觉花香浮、果香郁、木香沉。", "明几玉碗，汤色如金。见仙姝、素手轻斟。茶师论道，浅浅", "深深。若美人形、高人范、圣人襟。"], "n": [], "k": "二〇二一年十月十三日于福建武夷山", "g": "词", "cp": [], "rg": ["骏眉红·武夷山"], "tp": "品茶", "season": [], "jq": [], "cpai": "行香子", "st": "词"}, {"t": "浣溪沙·冬日品金骏眉", "a": "罗永珩", "d": "当代", "v": "词", "b": "正山堂诗词·壬寅集", "w": ["不负晴冬坐暖阳。浮生俗务暂相忘。一壶纵享慢时光。", "润色自存岩壑气，回甘犹带水云香。人间有味正山堂。"], "n": [], "k": "二〇二一年十二月二十六日于福建厦门", "g": "词", "cp": ["金骏眉"], "rg": [], "tp": "品茶", "season": ["冬"], "jq": [], "cpai": "浣溪沙", "st": "词"}, {"t": "西山兰若试茶歌", "a": "刘禹锡", "d": "唐", "v": "古人诗词集萃", "b": "正山堂诗词·壬寅集", "w": ["山僧后檐茶数丛，春来映竹抽新茸。", "莞然为客振衣起，自傍芳丛摘鹰嘴。", "斯须炒成满室香，便酌砌下金沙水。", "骤雨松声入鼎来，白云满碗花徘徊。", "悠扬喷鼻宿酲散，清峭彻骨烦襟开。", "阳崖阴岭各殊气，未若竹下莓苔地。", "炎帝虽尝未解煎，桐君有箓那知味？", "新芽连拳半未舒，自摘至煎俄顷余。", "木兰坠露香微似，瑶草临波色不如。", "僧言灵味宜幽寂，采采翘英为嘉客。", "不辞缄封寄郡斋，砖井铜炉损标格。", "何况蒙山顾渚春，白泥赤印走风尘。", "欲知花乳清泠味，须是眠云跂石人。"], "n": [], "k": "", "g": "诗", "cp": [], "rg": [], "tp": "品茶", "season": ["春"], "jq": [], "cpai": "", "st": "七古"}, {"t": "茶", "a": "林逋", "d": "宋", "v": "古人诗词集萃", "b": "正山堂诗词·壬寅集", "w": ["石碾轻飞瑟瑟尘，乳香烹出建溪春。", "世间绝品人难识，闲对《茶经》忆古人。"], "n": [], "k": "", "g": "诗", "cp": [], "rg": [], "tp": "咏茶", "season": ["春"], "jq": [], "cpai": "", "st": "七绝"}, {"t": "和章岷从事斗茶歌", "a": "范仲淹", "d": "宋", "v": "古人诗词集萃", "b": "正山堂诗词·壬寅集", "w": ["年年春自东南来，建溪先暖冰微开。", "溪边奇茗冠天下，武夷仙人从古栽。", "新雷昨夜发何处，家家嬉笑穿云去。", "露芽错落一番荣，缀玉含珠散嘉树。", "终朝采掇未盈襜，唯求精粹不敢贪。", "研膏焙乳有雅制，方中圭兮圆中蟾。", "北苑将期献天子，林下雄豪先斗美。", "鼎磨云外首山铜，瓶携江上中泠水。", "黄金碾畔绿尘飞，紫玉瓯心翠涛起。", "斗茶味兮轻醍醐，斗茶香兮薄兰芷。", "其问品第胡能欺，十目视而十手指。", "胜若登仙不可攀，输同降将无穷耻。", "吁嗟天产石上英，论功不愧阶前蓂。", "众人之浊我可清，千日之醉我可醒。", "屈原试与招魂魄，刘伶却得闻雷霆。", "卢仝敢不歌，陆羽须作经。", "森然万象中，焉知无茶星。", "商山丈人休茹芝，首阳先生休采薇。", "长安酒价减千万，成都药市无光辉。", "不如仙山一啜好，泠然便欲乘风飞。", "君莫羡花间女郎衹斗草，赢得珠玑满斗归。"], "n": [], "k": "", "g": "诗", "cp": [], "rg": ["骏眉红·武夷山"], "tp": "赠答酬和", "season": ["春"], "jq": [], "cpai": "", "st": "七古"}, {"t": "和梅公仪尝茶", "a": "欧阳修", "d": "宋", "v": "古人诗词集萃", "b": "正山堂诗词·壬寅集", "w": ["溪山击鼓助雷惊，逗晓灵芽发翠茎。", "摘处两旗香可爱，贡来双凤品尤精。", "寒侵病骨惟思睡，花落春愁未解酲。", "喜共紫瓯吟且酌，羡君萧洒有余清。"], "n": [], "k": "", "g": "诗", "cp": [], "rg": [], "tp": "赠答酬和", "season": ["春"], "jq": [], "cpai": "", "st": "七律"}, {"t": "行香子·茶词", "a": "苏轼", "d": "宋", "v": "古人诗词集萃", "b": "正山堂诗词·壬寅集", "w": ["绮席才终。欢意犹浓。酒阑时、高兴无穷。共夸君赐，初拆臣封。", "看分香饼，黄金缕，密云龙。", "斗赢一水，功敌千钟。觉凉生、两腋清风。暂留红袖，少却", "纱笼。放笙歌散，庭馆静，略从容。"], "n": [], "k": "", "g": "词", "cp": [], "rg": [], "tp": "咏茶", "season": [], "jq": [], "cpai": "行香子", "st": "词"}, {"t": "品令·茶词", "a": "黄庭坚", "d": "宋", "v": "古人诗词集萃", "b": "正山堂诗词·壬寅集", "w": ["凤舞团团饼，恨分破、教孤令。金渠体净，只轮慢碾，玉尘", "光莹。汤响松风，早减了、二分酒病。", "味浓香永，醉乡路、成佳境。恰如灯下故人，万里归来对影。", "口不能言，心下快活自省。"], "n": [], "k": "", "g": "词", "cp": [], "rg": [], "tp": "品茶", "season": [], "jq": [], "cpai": "品令", "st": "词"}, {"t": "茶", "a": "秦观", "d": "宋", "v": "古人诗词集萃", "b": "正山堂诗词·壬寅集", "w": ["茶实嘉木英，其香乃天育。", "芳不愧杜蘅，清堪掩椒菊。", "上客集堂葵，圆月探奁盝。", "玉鼎注漫流，金碾响文竹。", "侵寻发美鬯，猗狔生乳粟。", "经时不销歇，衣袂带纷郁。", "幸蒙巾笥藏，苦厌龙兰续。", "愿君斥异类，使我全芬馥。", "北岩采新茶用《忘怀录》中法煎饮欣然"], "n": [], "k": "", "g": "诗", "cp": [], "rg": [], "tp": "咏茶", "season": [], "jq": [], "cpai": "", "st": "五古"}, {"t": "忘病之未去也", "a": "陆游", "d": "宋", "v": "古人诗词集萃", "b": "正山堂诗词·壬寅集", "w": ["槐火初钻燧，松风自候汤。", "携篮苔径远，落爪雪芽长。", "细啜襟灵爽，微吟齿颊香。", "归时更清绝，竹影踏斜阳。"], "n": [], "k": "", "g": "诗", "cp": [], "rg": [], "tp": "其他", "season": [], "jq": [], "cpai": "", "st": "五律"}, {"t": "朝中措（其一）", "a": "范成大", "d": "宋", "v": "古人诗词集萃", "b": "正山堂诗词·壬寅集", "w": ["身闲身健是生涯。何况好年华。看了十分秋", "月，重阳更插黄花。", "消磨景物，瓦盆社酿，石鼎山茶。饱吃红莲", "香饭，侬家便是仙家。"], "n": [], "k": "", "g": "诗", "cp": [], "rg": [], "tp": "其他", "season": ["秋"], "jq": [], "cpai": "", "st": "五古"}, {"t": "水调歌头·咏茶", "a": "葛长庚", "d": "宋", "v": "古人诗词集萃", "b": "正山堂诗词·壬寅集", "w": ["二月一番雨，昨夜一声雷。枪旗争战，建溪春色占先魁。采", "取枝头雀舌，带露和烟捣碎，炼作紫金堆。碾破香无限，飞起绿", "尘埃。", "汲新泉，烹活水，试将来。放下兔毫瓯子，滋味舌头回。唤", "起青州从事，战退睡魔百万，梦不到阳台。两腋清风起，我欲上", "蓬莱。"], "n": [], "k": "", "g": "词", "cp": [], "rg": [], "tp": "咏茶", "season": ["春"], "jq": [], "cpai": "水调歌头", "st": "词"}, {"t": "朝中措·茶词", "a": "程垓", "d": "宋", "v": "古人诗词集萃", "b": "正山堂诗词·壬寅集", "w": ["华筵饮散撤芳尊。人影乱纷纷。且约玉骢留住，细将团凤平分。", "一瓯看取，招回酒兴，爽彻诗魂。歌罢清风两腋，归来明月", "千门。"], "n": [], "k": "", "g": "词", "cp": [], "rg": [], "tp": "咏茶", "season": [], "jq": [], "cpai": "朝中措", "st": "词"}, {"t": "风入松·酌惠山泉", "a": "张炎", "d": "宋", "v": "古人诗词集萃", "b": "正山堂诗词·壬寅集", "w": ["一瓢饮水曲肱眠。此乐不知年。今朝忽上龙峰顶，却元来、", "有此甘泉。洗却平生尘土，慵游万里山川。", "照人如鉴止如渊，古窦暗涓涓。当时桑苎今何在？想松风、", "吹断茶烟。著我白云堆里，安知不是神仙。"], "n": [], "k": "", "g": "词", "cp": [], "rg": [], "tp": "其他", "season": [], "jq": [], "cpai": "风入松", "st": "词"}, {"t": "茗饮", "a": "元好问", "d": "金", "v": "古人诗词集萃", "b": "正山堂诗词·壬寅集", "w": ["宿酲未破厌觥船，紫笋分封入晓煎。", "槐火石泉寒食后，鬓丝禅榻落花前。", "一瓯春露香能永，万里清风意已便。", "邂逅华胥犹可到，蓬莱未拟问群仙。"], "n": [], "k": "", "g": "诗", "cp": [], "rg": [], "tp": "品茶", "season": ["春"], "jq": [], "cpai": "", "st": "七律"}, {"t": "製新茶", "a": "黄宗羲", "d": "清", "v": "古人诗词集萃", "b": "正山堂诗词·壬寅集", "w": ["簷溜松风方扫尽，轻阴正是采茶天。", "相邀直上孤峰顶，出市俱争谷雨前。", "两筥东西分梗叶，一灯儿女共团圆。", "炒青已到更阑后，犹试新烹瀑布泉。"], "n": [], "k": "", "g": "诗", "cp": [], "rg": [], "tp": "采茶制茶", "season": [], "jq": ["谷雨"], "cpai": "", "st": "七律"}, {"t": "山居", "a": "爱新觉罗·玄烨", "d": "清", "v": "古人诗词集萃", "b": "正山堂诗词·壬寅集", "w": ["迎薰避暑驻山庄，四顾重重丘壑长。", "雨后雏莺歌密树，风前练雀舞斜廊。", "静观得趣无非景，佳兴涵虚可致凉。", "烹茗汲泉清意味，个中谁解有真香。"], "n": [], "k": "", "g": "诗", "cp": [], "rg": [], "tp": "其他", "season": [], "jq": [], "cpai": "", "st": "七律"}, {"t": "努力为世界做最好的红茶", "a": "江元勋", "d": "当代", "v": "附录", "b": "正山堂诗词·壬寅集", "w": ["正山堂传承红茶四百年，传承到我的手上已经二十四代。我", "们秉承着传统，不断创新，努力为世界做最好的红茶，塑造健康", "高雅的生活元素，努力地争做国茶，传播中华茶文化，努力地贡", "献自己的一份力量，争取早日将世界红茶的话语权，拿回中国人", "的手上，为民族的复兴，努力地贡献自己的力量。"], "n": [], "k": "摘自：二〇一六年正山堂企业宣传片", "g": "文", "cp": [], "rg": [], "tp": "咏茶", "season": [], "jq": [], "cpai": "", "st": "文"}, {"t": "茶之人生", "a": "江元勋", "d": "当代", "v": "附录", "b": "正山堂诗词·壬寅集", "w": ["生活在这里几十年，从小到大，以茶为生，放眼看去，到处", "都是茶。小时候印象当中的那个茶树那么大，到我今天五十多了，", "那个茶树依然还那么大，这个茶怎么老是长不大。想一想，一看", "好不容易每年生长上来那么一个芽就给它掐了，难怪它长不大。", "我的奶奶告诉我，茶是神物，是大自然赐予我们的，“茶叶米，", "茶叶米”，因为我们的生活所有的来源都得益于这个茶。我们一丝", "不苟地做下来，这个茶才能做好。苦难、磨砺、死去，在沸腾的", "水的冲泡下，它叶子舒展开了。闻到它的香气，感觉到那么好的", "味道的时候，似乎这片叶子，又重新活过来了。喝这杯茶的时候，", "是人与大自然的对话。所谓茶是什么呢？就是一草一木一人，人", "在草木间，感恩自然。"], "n": [], "k": "摘自：二〇一七年CCTV-13公益纪录片《茶之人生——江元勋》", "g": "文", "cp": [], "rg": [], "tp": "品茶", "season": [], "jq": [], "cpai": "", "st": "文"}, {"t": "精益求精，粗活细干", "a": "江元勋", "d": "当代", "v": "附录", "b": "正山堂诗词·壬寅集", "w": ["衹有精益求精，用心做，粗活细干，才能形成独特的干龙眼", "味和天然的松香和桂圆香，才能做出这杯好茶，而且不仅是要这", "样做，同时还要传、帮、带。"], "n": [], "k": "摘自：二〇一七年非物质文化遗产传承人纪录片", "g": "文", "cp": [], "rg": [], "tp": "其他", "season": [], "jq": [], "cpai": "", "st": "文"}, {"t": "拿回中国茶之世界话语权", "a": "江元勋", "d": "当代", "v": "附录", "b": "正山堂诗词·壬寅集", "w": ["大吉岭的红茶，口感鲜爽度更强，味道滋味上浓醇度很明显，", "但是收敛性偏重；武夷山的红茶润滑度更好，然后更柔更顺，唇", "齿留香。更重要的是这两款茶的根是相同的，一脉相承，出自于", "武夷山的桐木关。", "从浓红苦涩到今天的清香甘甜，金骏眉的创制出现，复兴了、", "推动了国内红茶的繁荣，由我一个人的坚守制作到现在千家万户", "的制作，由几十块钱一斤到上万块钱一斤，这个期间，小茶叶撑", "起了大民生，同时我们将国内红茶的标准进行了制定，将国内的", "话语权，首先给予了肯定。那么作为武夷山的茶农，我很有感慨，", "中国人中国茶要走到全世界，重新拿回中国茶的话语权和贸易份", "额。", "我是正山小种二十四代传人江元勋，二十年前我独自一人坚", "守红茶的制作，我没有放弃，就是为了先祖的那份荣光，我要为", "世界做最好的红茶，我要将世界茶的话语权拿回来。"], "n": [], "k": "摘自：二〇一八年十二月二日CCTV-2《魅力中国城》节目", "g": "文", "cp": ["金骏眉", "正山小种"], "rg": ["骏眉红·武夷山"], "tp": "咏茶", "season": [], "jq": [], "cpai": "", "st": "文"}, {"t": "藏地茶园记", "a": "侯书栋", "d": "当代", "v": "附录", "b": "正山堂诗词·壬寅集", "w": ["侯书栋", "天下茶园之高绝者，惟在藏地而已。临洪涛于悬台，藏布江", "兮雅鲁；居崇岭之峻极，唐古拉兮念青。浸冰川之润泽，汲雪域", "之华精。披云雾之朦胧，掩松杉之翠屏。处幽邃之秘境，畅超然", "之豪情。", "藏地茶园，集于林芝。江南野秀，净土琼枝。暖日晴烘，冻", "雨暮湿。玉蟾夜照，圣露朝滋。有波密之高巅，朔风张弛。有察", "隅之遥邈，桃源若失。有墨脱之孤洁，门珞相知。遗群独立万古，", "举世罕能登陟。", "藏人嗜茶，和酥油成日用。藏地无茶，引蒙顶入易贡。自此", "有嘉木，小叶群体种。卓然立芳姿，湖山映修容。古道铃声已杳，", "四海茗声渐隆。正山再肇新业，天地人茶成颂。和瑛当为长赋，", "仓央或语情浓。", "二〇二一年十一月于北京"], "n": [], "k": "", "g": "文", "cp": [], "rg": ["超然红", "察隅红"], "tp": "咏茶", "season": [], "jq": [], "cpai": "", "st": "文"}, {"t": "茶赋", "a": "姜祚正", "d": "当代", "v": "附录", "b": "正山堂诗词·壬寅集", "w": ["姜祚正", "彩云朵朵，祥雾重重；泉悬岩上，花笑林中。八百里清江，", "吐玉喷珠流日夜；三千座峻岭，伏猿栖鹤历秋冬。", "放翁煮茗潭边，吟成“不是名泉不合尝”之佳句；永叔寻幽", "江畔，指点“陆羽《茶经》第一州”之迹踪。物享山川灵气，邑", "存高士遗风。", "苗生富硒之土壤，茶为瑞草之首；功载神农之本草，茗乃良", "药之宗。", "黄芽方吐，绿脚初浓。虾须摇曳，蟹眼惺忪。继之千毫皆碧，", "万绿争荣。一山碧而四野绿，一人歌而众人从。碧绿互染，山野", "有情春有脚；唱和交融，歌声无价乐无穷。层层叠叠，梯田中朗", "朗笑声前后起；郁郁葱葱，茶园里纤纤玉手去来匆。", "科技精制，品质真纯。艺巧余甘可口，技精风味宜人。茶以“硒”", "为贵，科技能固硒而硒不散；茶以鲜为宝，精制能保鲜而鲜永存。", "活性元素，因科技融入而充分启动；益生品质，因精工研制而卓", "尔不群。", "品质有情无语，茶人公道在心。京津沪港台，高朋涌浪；亚", "澳非欧美，巨贾如云。知黑肤轻插金卡，柜机嚓嚓；见碧眼频摇", "拇指，“”声声。", "OK", "饮茶益智，品茶提神。看雅士登楼，衣冠楚楚；佳人品味，", "文质彬彬。悬壶高冲，清香味溢；定睛俯视，嫩叶枝伸。品其味，", "甜鲜馥郁；观其色，浅黄清纯。春饮而益思壮志，夏饮而止渴生津，", "秋饮而飘飘欲仙入霄汉，冬饮而腾腾暖气透全身！", "解静去胁，堪称上品；降脂破肥，亦属宝珍。明目清心，受惠", "有我；延年益寿，不可无君。林两举，已得订单一把把；味细品，", "又添馆宜一分分。直令咖啡俯首，可哥称臣；灵芝落晚，茉莉 const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const DIMS = [
  {key:'dy', label:'朝代', field:'d', multi:false, open:true},
  {key:'ge', label:'体裁', field:'g', multi:false, open:true},
  {key:'st', label:'诗体', field:'st', multi:false, open:true},
  {key:'cp', label:'茶品', field:'cp', multi:true, open:true},
  {key:'rg', label:'产区', field:'rg', multi:true, open:false},
  {key:'tp', label:'题材', field:'tp', multi:false, open:false},
  {key:'sn', label:'季节', field:'season', multi:true, open:true},
  {key:'jq', label:'节气', field:'jq', multi:true, open:false},
  {key:'ci', label:'词牌', field:'cpai', multi:false, open:false},
  {key:'bo', label:'书目', field:'b', multi:false, open:false},
];

const state = {};
DIMS.forEach(d => state[d.key] = '');

function buildGroups(){
  const g = $('groups');
  g.innerHTML = DIMS.map(d => {
    let tags;
    if (d.multi) {
      const all = new Set();
      POEMS.forEach(p => (p[d.field]||[]).forEach(v => all.add(v)));
      tags = [...all];
    } else {
      tags = [...new Set(POEMS.map(p => p[d.field]).filter(Boolean))];
    }
    const order = {dy:['当代','唐','宋','元','金','清'],ge:['诗','词','赋','文'],st:['五绝','七绝','五律','七律','五古','七古','词','赋','文'],sn:['春','夏','秋','冬']};
    if (order[d.key]) tags.sort((a,b) => (order[d.key].indexOf(a)+99) - (order[d.key].indexOf(b)+99));
    const html = tags.map(v => '<span class="tag" data-k="'+d.key+'" data-v="'+esc(v)+'">'+esc(v)+'</span>').join('');
    return '<details class="group" '+(d.open?'open':'')+'><summary>'+d.label+'<span class="cnt">'+tags.length+'</span></summary><div class="tags">'+html+'</div></details>';
  }).join('');
  g.querySelectorAll('.tag').forEach(t => t.addEventListener('click', () => {
    const k = t.dataset.k, v = t.dataset.v;
    state[k] = (state[k] === v) ? '' : v;
    g.querySelectorAll('.tag[data-k="'+k+'"]').forEach(x => x.classList.toggle('on', x.dataset.v === state[k]));
    render();
  }));
}

function match(p){
  const q = $('q').value.trim().toLowerCase();
  if (q) {
    const hay = [p.t, p.a, (p.w||[]).join(''), (p.n||[]).join('')].join('').toLowerCase();
    if (!hay.includes(q)) return false;
  }
  for (const d of DIMS) {
    const v = state[d.key];
    if (!v) continue;
    const fv = p[d.field];
    if (d.multi) { if (!(fv||[]).includes(v)) return false; }
    else { if (fv !== v) return false; }
  }
  return true;
}

    return '<div class="card">' +
      '<div class="title">' + esc(p.t) + '</div>' +
      '<div class="meta">' + tags + '<span class="author">' + esc(p.a) + '</span><span>' + esc(p.d) + '</span><span>' + esc(p.b) + '</span></div>' +
      '<div class="preview">' + esc(preview) + '</div>' +
      '<div class="full">' + body + note + kuan + '</div>' +
    '</div>';
  }).join('');
  list.querySelectorAll('.card').forEach(c => c.addEventListener('click', () => c.classList.toggle('open')));
}

$('q').addEventListener('input', render);
$('reset').addEventListener('click', () => {
  $('q').value = '';
  DIMS.forEach(d => state[d.key] = '');
  document.querySelectorAll('.tag').forEach(x => x.classList.remove('on'));
  render();
});

buildGroups();
render();
</script>
</body>
</html>
